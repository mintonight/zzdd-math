-1) - 1/(-1) = 1$（注意 $-1/(-1) = 1$，不是 $-1$），$z = 1$。$f = 1 \\cdot (-1 + 1) = 0$。\n• $x = \\frac{-1+\\sqrt 3}{2}$：$1/x = \\frac{2}{-1+\\sqrt 3} = \\frac{2(-1-\\sqrt 3)}{(-1)^2 - 3} = 1+\\sqrt 3$。\n$y = 1 + \\frac{-1+\\sqrt 3}{2} - (1+\\sqrt 3) = \\frac{-1-\\sqrt 3}{2}$。验证 $x^2+y^2 = \\frac{(1-\\sqrt 3)^2 + (1+\\sqrt 3)^2}{4} = \\frac{4-2\\sqrt 3 + 4+2\\sqrt 3}{4} = 2$ ✓。\n$z = 2 - y = \\frac{5+\\sqrt 3}{2}$，$x + z = \\frac{-1+\\sqrt 3 + 5+\\sqrt 3}{2} = 2 + \\sqrt 3$。\n$f = y(x+z) = \\frac{-1-\\sqrt 3}{2}(2 + \\sqrt 3) = \\frac{-2 - \\sqrt 3 - 2\\sqrt 3 - 3}{2} = \\frac{-5 - 3\\sqrt 3}{2} \\approx -5.10$。\n• $x = \\frac{-1-\\sqrt 3}{2}$：对称地 $1/x = 1 - \\sqrt 3$，$y = \\frac{-1+\\sqrt 3}{2}$，$z = \\frac{5-\\sqrt 3}{2}$，$x + z = 2 - \\sqrt 3$。\n$f = y(x+z) = \\frac{-1+\\sqrt 3}{2}(2 - \\sqrt 3) = \\frac{-2 + \\sqrt 3 + 2\\sqrt 3 - 3}{2} = \\frac{-5 + 3\\sqrt 3}{2} \\approx 0.098$。\n四个候选值排序：$\\frac{-5 - 3\\sqrt 3}{2} < 0 < \\frac{-5 + 3\\sqrt 3}{2} < 2$。\n$f_{\\max} = 2$（在 $x = 1$ 处）；$f_{\\min} = \\dfrac{-5 - 3\\sqrt 3}{2}$（在 $x = \\frac{-1+\\sqrt 3}{2}$ 处）。\n注意：约束集 $\\{x^2+y^2=2, y+z=2\\}$ 是 $\\mathbb R^3$ 中 1 维紧致曲线（$xy$ 圆 × $z$ 由 $y$ 决定的关系），$f$ 在其上必有最值，由 Lagrange 必要条件抓出来的 4 个候选已穷尽极值候选——所以上面的 $f_{\\max}, f_{\\min}$ 即全局最值。\n关键模板：多约束 Lagrange = 一个目标 + $k$ 个约束 → $L = f + \\sum_{i=1}^k \\lambda_i g_i$，求 $n + k$ 个偏导 = 0。考研里二约束最常见，按上面流程能拆出多项式方程。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第19章 多元函数极值", "body": "Q1. Lagrange 乘数 $\\lambda$ 的物理/经济意义？\nDiscussion: $\\lambda$ 是约束的\"影子价格\"（shadow price）。\n设最优值 $f^* = f^*(b)$ 是约束右端 $b$（即 $g(x, y) = b$）的函数。则\n$$\\frac{df^*}{db} = -\\lambda^*.$$\n经济：$|\\lambda^*|$ 是该约束的\"边际价值\"——放松约束 1 单位带来的最优值变化。\n物理：$\\lambda$ 在分析力学中是约束反力的强度。\n意义：$\\lambda$ 不是凑出来的辅助变量，而是有深远经济/物理含义的\"敏感度\" 量。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第19章 多元函数极值", "body": "Q2. Hessian 判别与本系列第二卷《线性代数》的二次型分类完全对应。是巧合吗？\nDiscussion: 不是巧合，是同一概念两种身份。\n二阶 Taylor 在驻点 $f(x_0 + \\Delta x) = f(x_0) + \\frac{1}{2}\\Delta x^T H \\Delta x + o(\\|\\Delta x\\|^2)$。\n二次型 $\\frac{1}{2}\\Delta x^T H \\Delta x$ 正定 $\\iff f$ 局部极小。\n意义：\n• 微积分的\"局部分析\" 借用了线性代数的\"二次型分类\"。\n• 这种统一让\"$n$ 元函数极值\" 的几何（碗、倒碗、鞍）有了精确语言。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q1. $\\iint_D x \\, d\\sigma$，$D$ 由 $y = x, y = x^2$ 围成。\nAnswer: 交点 $x = 0, 1$，$x \\ge x^2$。$\\iint = \\int_0^1 dx\\int_{x^2}^x x dy = \\int_0^1 x(x - x^2) dx = \\int_0^1(x^2 - x^3) dx = \\frac{1}{3} - \\frac{1}{4} = \\frac{1}{12}$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q2. $\\iint_D y d\\sigma$，$D$ = 上半单位圆。\nAnswer: 极坐标 $\\theta \\in [0, \\pi], r \\in [0, 1]$。\n$\\iint = \\int_0^\\pi\\int_0^1 r\\sin\\theta \\cdot r dr d\\theta = \\int_0^\\pi\\sin\\theta d\\theta \\cdot \\int_0^1 r^2 dr = 2 \\cdot \\frac{1}{3} = \\frac{2}{3}$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q3. 用对称性求 $\\iint_D x \\, d\\sigma$，$D$ = 单位圆。\nAnswer: $D$ 关于 $y$ 轴对称，$x$ 关于 $x$ 是奇函数。积分 $= 0$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q4. $\\iint_D\\frac{1}{1 + x^2 + y^2} d\\sigma$，$D$ = 单位圆。\nAnswer: 极坐标：$\\int_0^{2\\pi}\\int_0^1\\frac{r}{1+r^2} dr d\\theta = 2\\pi \\cdot \\frac{1}{2}\\ln(1 + r^2)\\Big|_0^1 = 2\\pi \\cdot \\frac{\\ln 2}{2} = \\pi\\ln 2$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q5. $\\iint_D \\sin(x + y) d\\sigma$，$D = [0, \\pi] \\times [0, \\pi]$。\nAnswer: $\\iint = \\int_0^\\pi dx \\int_0^\\pi \\sin(x + y) dy = \\int_0^\\pi[-\\cos(x+y)]_0^\\pi dx = \\int_0^\\pi[\\cos x - \\cos(x+\\pi)] dx$。\n$\\cos(x + \\pi) = -\\cos x$，所以 $[\\cdot] = 2\\cos x$。\n$\\iint = \\int_0^\\pi 2\\cos x \\, dx = 2\\sin x\\Big|_0^\\pi = 0$。\n或用对称：$\\sin(x+y)$ 在 $[0, \\pi]^2$ 上关于中心 $(\\pi/2, \\pi/2)$ 中心反对称（即 $f(\\pi-x, \\pi-y) = -f(x, y)$，二维版的\"奇函数\"）。验证：$\\sin((\\pi-x) + (\\pi-y)) = \\sin(2\\pi - x - y) = -\\sin(x+y)$ ✓。中心反对称在中心对称区域上的积分为 0。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q1. 由 $z = x^2 + y^2$ 与 $z = 2 - x^2 - y^2$ 围成立体的体积。", "hint": "", "answer": "两面交于 $x^2 + y^2 = 1$（$z = 1$）。投影 $D$ = 单位圆。\n$V = \\iint_D[(2 - x^2 - y^2) - (x^2 + y^2)] d\\sigma = \\iint_D(2 - 2(x^2 + y^2)) d\\sigma$。\n极坐标：$\\int_0^{2\\pi}\\int_0^1(2 - 2r^2) r dr d\\theta = 2\\pi \\cdot [r^2 - \\frac{r^4}{2}]_0^1 = 2\\pi \\cdot \\frac{1}{2} = \\pi$。"}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q2. 换序求 $\\int_0^1 dy\\int_{\\sqrt y}^1 e^{x^3} dx$。\nAnswer: $D = \\{0 \\le y \\le 1, \\sqrt y \\le x \\le 1\\}$。即 $y \\le x^2 \\le 1$。\nX 型：$0 \\le x \\le 1, 0 \\le y \\le x^2$。\n$\\int_0^1 dx\\int_0^{x^2} e^{x^3} dy = \\int_0^1 x^2 e^{x^3} dx$。\n凑微分 $d(x^3) = 3x^2 dx$：$= \\frac{1}{3} e^{x^3}\\Big|_0^1 = \\frac{e - 1}{3}$。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q3. $\\iint_D xy d\\sigma$，$D = \\{0 \\le x \\le 1, x^2 \\le y \\le \\sqrt x\\}$。\nAnswer: $\\int_0^1 x dx\\int_{x^2}^{\\sqrt x} y dy = \\int_0^1 x \\cdot \\frac{x - x^4}{2} dx = \\frac{1}{2}\\int_0^1(x^2 - x^5) dx = \\frac{1}{2}(\\frac{1}{3} - \\frac{1}{6}) = \\frac{1}{12}$。\nQ4（数一）：面密度 $\\rho = x^2 + y^2$ 的圆盘 $D = \\{x^2 + y^2 \\le R^2\\}$ 的总质量与质心。\nAnswer: $m = \\int_0^{2\\pi}\\int_0^R r^2 \\cdot r dr d\\theta = 2\\pi \\cdot \\frac{R^4}{4} = \\frac{\\pi R^4}{2}$。\n质心 $(\\bar x, \\bar y) = (0, 0)$（对称性：$D$ 关于 $y$ 轴对称且 $x\\rho$ 关于 $x$ 是奇；同理 $\\bar y = 0$）。\nQ5（数一）：求 $\\iint_D(\\sqrt x + \\sqrt y) d\\sigma$，$D = \\{0 \\le x, y \\le 1\\}$。\nAnswer: $\\iint(\\sqrt x + \\sqrt y) = \\iint\\sqrt x + \\iint\\sqrt y$。由对称两者相等。\n$\\iint\\sqrt x = \\int_0^1\\sqrt x dx \\cdot \\int_0^1 dy = \\frac{2}{3} \\cdot 1 = \\frac{2}{3}$。\n总 $= \\frac{4}{3}$。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q6. 求由 $y = x^2, y = 4 - x^2$ 围成区域 $D$ 的面积。\nAnswer: 交点 $x = \\pm\\sqrt 2$。$\\text{Area} = \\int_{-\\sqrt 2}^{\\sqrt 2}[(4 - x^2) - x^2] dx = \\int_{-\\sqrt 2}^{\\sqrt 2}(4 - 2x^2) dx$。\n由偶函数：$= 2\\int_0^{\\sqrt 2}(4 - 2x^2) dx = 2[4\\sqrt 2 - \\frac{2 \\cdot 2\\sqrt 2}{3}] = 2 \\cdot \\frac{8\\sqrt 2}{3} = \\frac{16\\sqrt 2}{3}$。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第20章 二重积分", "body": "Q1. 二重积分的 Jacobian 因子 $r$ 几何上代表什么？\nDiscussion: $d\\sigma = r dr d\\theta$ 的 $r$ 是\"小区域面积关于 $(r, \\theta)$ 微元矩形面积的比\"。\n具体：极坐标下\"小扇环\" 的面积约 $(r d\\theta) \\cdot dr = r dr d\\theta$（弧长 × 径向宽度）。\n一般 $\\mathbb{R}^n$ 换元公式：$\\int f d\\vec x = \\int f \\cdot |J| d\\vec u$，$|J|$ 是 Jacobian 行列式（绝对值）。它是\"小体积在新坐标系下的伸缩率\"。\n意义：\n• 任何坐标变换都需要 Jacobian 修正。\n• Jacobian = 0 的点是\"奇点\"（如极坐标在 $r = 0$ 处 Jacobian = 0，对应直角坐标的原点）。\n• 在多元微积分（第 21 章）会扩展到三维（$r, r^2\\sin\\varphi$ 等更复杂的 Jacobian）。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q1. $\\frac{dy}{dx} = \\frac{1 + y^2}{1 + x^2}$。\nAnswer: 见例 27.5。$\\arctan y = \\arctan x + C$，$y = \\tan(\\arctan x + C)$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q2. $y' + 2y/x = x^2$（$x > 0$）。\nAnswer: $P = 2/x, \\mu = e^{2\\ln x} = x^2$。\n$(x^2 y)' = x^2 \\cdot x^2 = x^4$。$x^2 y = \\frac{x^5}{5} + C$。$y = \\frac{x^3}{5} + \\frac{C}{x^2}$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q3. $\\frac{dy}{dx} = \\frac{2xy}{x^2 + y^2}$。\nAnswer: 见例 27.7。$y = C(x^2 - y^2)$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q4. $y' - 2y = e^{2x}$，$y(0) = 1$。\nAnswer: 见例 27.10。$y = e^{2x}(x + 1)$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q5. 半衰期 $T_{1/2} = 5730$ 年的碳 14。一具尸体含碳 14 是新鲜骨骼的 10%。死亡时间多久前？\nAnswer: $N(t) = N_0 e^{-\\lambda t}$，$\\lambda = \\ln 2 / T_{1/2}$。\n$0.1 = e^{-\\lambda t} \\Rightarrow t = \\frac{\\ln 10}{\\lambda} = \\frac{T_{1/2} \\ln 10}{\\ln 2} = 5730 \\cdot \\frac{\\ln 10}{\\ln 2} \\approx 5730 \\cdot 3.32 \\approx 19035$ 年。\n碳 14 测年是考古学的核心方法。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q1. 物体自由下落 $m\\frac{dv}{dt} = mg - kv$。$v(0) = 0$。求 $v(t)$。\nAnswer: 见 §27.7 自由落体例。$v(t) = \\frac{mg}{k}(1 - e^{-kt/m})$。终速度 $\\frac{mg}{k}$。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q2. $y'\\cos y - \\sin y = -x$。\nAnswer: 设 $z = \\sin y, z' = y' \\cos y$。方程变为 $z' - z = -x$（线性）。\n$\\mu = e^{-x}$。$(e^{-x} z)' = -x e^{-x}$。\n$\\int -x e^{-x} dx$：分部 $u = -x,\\ dv = e^{-x} dx;\\ du = -dx,\\ v = -e^{-x}$：\n$\\int -xe^{-x}dx = (-x)(-e^{-x}) - \\int(-e^{-x})(-dx) = xe^{-x} - \\int e^{-x}dx = xe^{-x} + e^{-x} = e^{-x}(x + 1)$。\n校验：$\\dfrac{d}{dx}[e^{-x}(x+1)] = -e^{-x}(x+1) + e^{-x} = e^{-x}(1 - x - 1) = -xe^{-x}$ ✓。\n$e^{-x} z = e^{-x}(x + 1) + C$，$z = x + 1 + C e^x$。\n$\\sin y = x + 1 + C e^x$，$y = \\arcsin(x + 1 + C e^x)$。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q3. 95℃ 咖啡在 20℃ 房间 5 分钟后冷到 80℃。10 分钟后？\nAnswer: $T(t) = 20 + 75 e^{-kt}$。\n$T(5) = 20 + 75 e^{-5k} = 80 \\Rightarrow e^{-5k} = 60/75 = 0.8 \\Rightarrow k = -\\ln 0.8 / 5$。\n$T(10) = 20 + 75 e^{-10k} = 20 + 75 \\cdot (e^{-5k})^2 = 20 + 75 \\cdot 0.64 = 20 + 48 = 68$ ℃。\nQ4（数一）：Bernoulli $y' + y/x = y^2\\ln x$。\nAnswer: $n = 2$，代 $z = y^{-1}$：$z' - z/x = -\\ln x$（用前面公式 $z' + (1-n)Pz = (1-n)Q$：$z' + (-1)(1/x)z = -\\ln x$ 即 $z' - z/x = -\\ln x$）。\n$\\mu = e^{-\\ln x} = 1/x$。$(z/x)' = -\\ln x / x$。\n$\\int -\\ln x / x \\, dx$：凑微分 $d(\\ln x) = dx/x$，$\\int -\\ln x \\, d(\\ln x) = -(\\ln x)^2/2$。\n$z/x = -(\\ln x)^2/2 + C$，$z = x[C - (\\ln x)^2/2]$。\n$y = 1/z = \\frac{1}{x[C - (\\ln x)^2/2]}$。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q5. 容器有 100 升盐水，含盐 5 千克。每分钟流入纯水 2 升，搅拌后流出 2 升盐水。$t$ 时刻含盐量？\nAnswer: 设 $t$ 时刻盐量 $y(t)$（千克）。盐浓度 $y/100$ 千克 / 升。\n流出速率 = 浓度 × 流量 = $\\frac{y}{100} \\cdot 2 = \\frac{y}{50}$ 千克 / 分。\n$\\frac{dy}{dt} = -\\frac{y}{50}$。\n变量可分离 $y = C e^{-t/50}$。$y(0) = 5 \\Rightarrow C = 5$。\n$y(t) = 5 e^{-t/50}$。\n例：$t = 50$ 分钟时 $y \\approx 5/e \\approx 1.84$ 千克。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q1. 一阶 ODE 的\"积分因子\" 几何意义？\nDiscussion: $y' + Py = Q$ 重写 $(Py - Q) dx + dy = 0$（即 $M dx + N dy = 0$ 形式，$M = Py - Q, N = 1$）。\n判 $M_y = N_x$：$M_y = P, N_x = 0$。除非 $P = 0$，否则不是全微分。\n乘 $\\mu = e^{\\int P dx}$，$\\mu M dx + \\mu N dy = 0$ 变成全微分（验证 $(\\mu M)_y = (\\mu N)_x$）。\n几何：原方程在每点规定了解曲线的斜率 $-M/N = -(Py - Q)$。乘 $\\mu$ 不改变这些解曲线，但是让方程左边成为某个函数 $u$ 的全微分（这里 $u = \\mu y - \\int \\mu Q\\,dx$），于是解曲线就是 $u$ 的等高线 $u(x, y) = C$，从\"斜率方程\" 变成了\"代数方程\" 形式。\n这是\"积分因子\" 的几何核心：寻找标量函数把\"局部斜率方程\" 变成\"全局函数方程\"。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q2. ODE 通解含 $n$ 个常数。与\"$n$ 阶方程的解空间\" 关系？\nDiscussion:\n线性齐次 ODE 的解空间是向量空间。一阶齐次维 1，$n$ 阶齐次维 $n$。\n非齐次解 = 特解 + 齐次通解（仿射子空间）。\n意义：\n• \"$n$ 个常数\" 对应\"$n$ 个初值条件\" 唯一确定解。\n• 解空间结构与线性代数对应。这是 ODE 与线代的统一视角，第 28 章会更深入。\n• 这种统一让\"高阶 ODE → 一阶 ODE 系统\" 的变换成为系统手段。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第27章 常微分方程基础", "body": "Q3. ODE 与\"决定论\" 的关系？\nDiscussion:\n经典力学的\"决定论\"（Laplace 1814 提出\"Laplace 妖\"）：给定宇宙某一刻的所有质点位置和速度，未来的所有运动都被唯一确定。\n数学背景：牛顿定律是二阶 ODE。给定 $(x_0, v_0)$ 初值，Cauchy-Lipschitz 定理给出唯一解 $x(t)$。所以\"未来唯一确定\"。\n但是 20 世纪发现两个限制：\n• 量子力学：测不准原理让\"同时知道位置和速度\" 不可能。Laplace 妖在量子层面失效。\n• 混沌理论（Poincaré 1890s, Lorenz 1963）：即使经典 ODE，对初值的极敏感性让\"长期预测\" 实际上不可能（\"蝴蝶效应\"）。\n意义：ODE 给出\"理论决定论\"，但是物理实践中\"实用决定论\" 在两个方向上都有限制。这是数学与物理学交界的深刻话题。\n考研只考具体 ODE 求解，但是知道这些\"哲学背景\" 让 ODE 这个工具更有意义。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q1. $y'' + 4y' + 5y = 0$ 通解。\nAnswer: $r^2 + 4r + 5 = 0, r = \\frac{-4 \\pm \\sqrt{-4}}{2} = -2 \\pm i$。\n$y = e^{-2x}(C_1\\cos x + C_2\\sin x)$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q2. $y'' - 4y = e^{2x}$ 通解。\nAnswer: 特征 $r^2 - 4 = 0, r = \\pm 2$。$y_h = C_1 e^{2x} + C_2 e^{-2x}$。\n$\\lambda = 2$ 是单根。试 $y^* = A x e^{2x}$。\n$y^{*'} = A e^{2x} + 2A x e^{2x}$，$y^{*''} = 2A e^{2x} + 2A e^{2x} + 4A x e^{2x} = 4A e^{2x} + 4A x e^{2x}$。\n代入：$4A e^{2x} + 4A x e^{2x} - 4A x e^{2x} = e^{2x}$，$4A = 1, A = 1/4$。\n$y^* = \\frac{x e^{2x}}{4}$。\n通解：$y = C_1 e^{2x} + C_2 e^{-2x} + \\frac{x e^{2x}}{4}$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q3. $y'' + y = x^2 + 1$ 通解。\nAnswer: $y_h = C_1\\cos x + C_2\\sin x$。\n$\\lambda = 0$（隐含）不是特征根。试 $y^* = a x^2 + b x + c$。\n$y^{*''} = 2a$。代入 $2a + a x^2 + b x + c = x^2 + 1$：$a = 1, b = 0, c = -1$。\n$y^* = x^2 - 1$。\n通解：$y = C_1\\cos x + C_2\\sin x + x^2 - 1$。\nQ4（数三）：$y_{n+1} - 3 y_n = 5, y_0 = 0$。\nAnswer: 齐次 $y_n^h = C \\cdot 3^n$。\n特解（常数）：$A - 3A = 5 \\Rightarrow A = -5/2$。\n通解 $y_n = C \\cdot 3^n - 5/2$。\n$y_0 = C - 5/2 = 0 \\Rightarrow C = 5/2$。\n特解：$y_n = \\frac{5(3^n - 1)}{2}$。", "hint": "", "answer": ""}, {"tag": "概念自检", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q5. $y'' - 6y' + 9y = e^{3x}$。\nAnswer: 特征 $r^2 - 6r + 9 = (r-3)^2 = 0$，$r = 3$ 重根。$y_h = (C_1 + C_2 x) e^{3x}$。\n$\\lambda = 3$ 是重根。试 $y^* = A x^2 e^{3x}$（升两次）。\n$y^{*'} = 2Ax e^{3x} + 3Ax^2 e^{3x} = Ax e^{3x}(2 + 3x)$。\n$y^{*''} = A e^{3x}(2 + 3x) + Ax e^{3x} \\cdot 3 + 3Ax e^{3x}(2 + 3x)$，整理 $= A e^{3x}(2 + 12x + 9x^2)$。\n代入：$A e^{3x}[(2 + 12x + 9x^2) - 6(2x + 3x^2) + 9x^2] = A e^{3x}[2 + 12x + 9x^2 - 12x - 18x^2 + 9x^2] = 2A e^{3x}$。\n设 $= e^{3x}$：$2A = 1, A = 1/2$。\n$y^* = \\frac{x^2 e^{3x}}{2}$。\n通解：$y = (C_1 + C_2 x) e^{3x} + \\frac{x^2 e^{3x}}{2}$。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q1. 弹簧无阻尼 $m\\ddot x + kx = 0$。\nAnswer: 特征 $mr^2 + k = 0, r = \\pm i\\sqrt{k/m}$。\n$x = C_1\\cos\\omega t + C_2\\sin\\omega t, \\omega = \\sqrt{k/m}$。\n简谐振动周期 $T = 2\\pi/\\omega = 2\\pi\\sqrt{m/k}$。\n物理：$\\omega$ 是固有角频率。质量 $m$ 大、弹簧硬度 $k$ 小时周期长。", "hint": "", "answer": ""}, {"tag": "应用练习", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q2. $y'' + 2y' + 5y = e^{-x}\\sin 2x$。\nAnswer: 特征 $r^2 + 2r + 5 = 0 \\Rightarrow r = -1 \\pm 2i$。所以 $\\lambda + i\\omega = -1 + 2i$ 与右端 $e^{-x}\\sin 2x = \\mathrm{Im}\\, e^{(-1+2i)x}$ 的指数完全匹配——$(-1+2i)$ 是特征根（重数 $k=1$），需要升一阶幂。\n复数法（最干净的算法）：解辅助方程 $z'' + 2z' + 5z = e^{(-1+2i)x}$。设 $\\alpha = -1+2i$。试 $z^* = Cx e^{\\alpha x}$：\n• $z^{*\\prime} = Ce^{\\alpha x}(1 + \\alpha x)$\n• $z^{*\\prime\\prime} = Ce^{\\alpha x}(2\\alpha + \\alpha^2 x)$\n代入左端：$Ce^{\\alpha x}\\big[(2\\alpha + \\alpha^2 x) + 2(1 + \\alpha x) + 5x\\big] = Ce^{\\alpha x}\\big[(2\\alpha + 2) + (\\alpha^2 + 2\\alpha + 5)x\\big]$。\n$\\alpha^2 + 2\\alpha + 5 = 0$（特征方程），$2\\alpha + 2 = 2(-1+2i) + 2 = 4i$。\n所以左端 $= 4iC \\cdot e^{\\alpha x}$。要等于 $e^{\\alpha x}$，故 $4iC = 1$，$C = -\\frac{i}{4}$。\n$z^* = -\\frac{i}{4}x e^{(-1+2i)x} = -\\frac{i}{4}x e^{-x}(\\cos 2x + i\\sin 2x) = \\frac{x e^{-x}}{4}(\\sin 2x - i\\cos 2x)$。\n取虚部：\n$$y^* = \\mathrm{Im}\\, z^* = -\\frac{x e^{-x}\\cos 2x}{4}.$$\n也就是说，若用实数法设 $y^* = x e^{-x}(A\\cos 2x + B\\sin 2x)$，结果是 $A = -\\frac{1}{4}, B = 0$。通解：$y = e^{-x}(C_1\\cos 2x + C_2\\sin 2x) - \\frac{x e^{-x}\\cos 2x}{4}$。这道题揭示了复数法对\"自由项含 $\\sin/\\cos \\cdot e^{\\lambda x}$\" 的题型有 4-5 倍效率优势——把一对实数方程降为一个复数方程。考研里数一会出此类，复数法值得熟练。\nQ3（数二）：$y y'' = (y')^2 + y'$。\nAnswer: 缺 $x$。$y' = p(y), y'' = p\\frac{dp}{dy}$。\n$y p \\frac{dp}{dy} = p^2 + p = p(p + 1)$。\n设 $p \\ne 0$：$y \\frac{dp}{dy} = p + 1$，分离 $\\frac{dp}{p+1} = \\frac{dy}{y}$。\n$\\ln|p+1| = \\ln|y| + C_1' \\Rightarrow p + 1 = C_1 y, p = C_1 y - 1$。\n$\\frac{dy}{dx} = C_1 y - 1$（一阶变量可分离）。\n$\\frac{dy}{C_1 y - 1} = dx$。$\\frac{1}{C_1}\\ln|C_1 y - 1| = x + C_2'$。\n$C_1 y - 1 = C_3 e^{C_1 x}$，$y = \\frac{1 + C_3 e^{C_1 x}}{C_1}$。\n丢解检查：上面两处做了除法。(1) 设了 $p \\ne 0$：$p \\equiv 0$ 即常数解 $y = c$，代回原方程两边都是 0，成立；$c \\ne 0$ 时已含在上式中（取 $C_3 = 0, C_1 = 1/c$），$y \\equiv 0$ 不在其中。(2) 除了 $C_1$：$C_1 = 0$ 时 $y' = -1$，$y = -x + C_2$，代回原方程左边 $y y'' = 0$，右边 $(-1)^2 + (-1) = 0$，也成立，同样不在上式中。所以除上式外还要补上 $y \\equiv 0$ 与 $y = -x + C_2$。\nQ4（数一）：Euler 方程 $x^2 y'' - 3xy' + 4y = 0$。\nAnswer: 见例 28.10。$y = (C_1 + C_2\\ln x) x^2$。\nQ5（受迫振动）：$\\ddot x + 4x = \\cos 2t$，$x(0) = 0, \\dot x(0) = 0$。\nAnswer: 齐次 $\\omega = 2$，特征根 $\\pm 2i$。\n$\\lambda + i\\omega = 2i$（$\\lambda = 0, \\omega = 2$）是特征根。共振。\n试 $x^* = t(A\\cos 2t + B\\sin 2t)$。\n$\\dot x^* = (A\\cos 2t + B\\sin 2t) + t(-2A\\sin 2t + 2B\\cos 2t)$\n$\\quad = (A + 2Bt)\\cos 2t + (B - 2At)\\sin 2t$。\n$\\ddot x^* = 2B\\cos 2t - 2(A + 2Bt)\\sin 2t - 2A\\sin 2t + 2(B - 2At)\\cos 2t$\n$\\quad = (2B + 2B - 4At)\\cos 2t + (-2A - 2A - 4Bt)\\sin 2t$\n$\\quad = (4B - 4At)\\cos 2t - (4A + 4Bt)\\sin 2t$。\n代入 $\\ddot x + 4x$：\n$$(4B - 4At)\\cos 2t - (4A + 4Bt)\\sin 2t + 4t(A\\cos 2t + B\\sin 2t)$$\n$$= (4B - 4At + 4At)\\cos 2t + (-4A - 4Bt + 4Bt)\\sin 2t = 4B\\cos 2t - 4A\\sin 2t.$$\n要等于 $\\cos 2t$：$4B = 1, -4A = 0$，得 $A = 0, B = 1/4$。\n$x^* = \\frac{t \\sin 2t}{4}$。\n通解 $x = C_1\\cos 2t + C_2\\sin 2t + \\frac{t\\sin 2t}{4}$。\n初值：$x(0) = C_1 = 0$；$\\dot x(0) = 2C_2 + 0 = 0$，$C_2 = 0$。\n特解 $x(t) = \\frac{t\\sin 2t}{4}$。\n物理：共振 现象。系统在固有频率被驱动，振幅 $\\frac{t}{4}$ 随时间线性增长。理论上 $t \\to \\infty$ 振幅无穷大；实际中能量积累会破坏系统结构。", "hint": "", "answer": ""}, {"tag": "深度思考", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：第28章 高阶微分方程与差分方程", "body": "Q1. 二阶常系数齐次线性方程的解集是 2 维向量空间。与线代\"特征值-特征向量\" 对应？\nDiscussion:\n设 $(y, y')^T = \\vec u$。原方程化为 $\\frac{d\\vec u}{dx} = A\\vec u$，$A = \\begin{pmatrix} 0 & 1 \\\\ -q & -p \\end{pmatrix}$。\n$A$ 的特征方程 $\\det(A - rI) = 0$ 给 $r^2 + pr + q = 0$——正是 ODE 的特征方程。\nODE 特征根 = 矩阵 $A$ 特征值。每个特征值 $r$ 对应一个特征向量 $\\vec v$，给解 $\\vec u(x) = e^{rx} \\vec v$，即 $y(x) = e^{rx}$ 乘上某常数。\n意义：\n• ODE 与线代的\"特征值理论\" 完全对应。\n• 高阶 ODE → 一阶 ODE 系统的化归是统一手段。$n$ 阶 ODE 等价于 $n$ 维一阶 ODE 系统。\n• 这种统一让\"动力系统理论\" 有完整代数语言。混沌、稳定性、分岔等概念都建立在这一基础上。", "hint": "", "answer": ""}]}, {"id": "caw", "name": "微积分 · 误区博物馆", "cnt": 21, "probs": [{"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第1章 函数与数学语言", "body": "错误解答\n题目：判断 $f(x) = x + x^2$ 的奇偶性。\n错误解答：\n\"$x$ 是奇函数，$x^2$ 是偶函数。奇 + 偶看情形，可能仍是奇，可能是偶。这道题里 $x + x^2$，主项 $x^2$ 是偶，所以整体是偶函数。\"", "hint": "", "answer": "错在哪里\n错在\"奇 + 偶 = 偶 或 奇\" 这个\"看情形\" 的说法本身就是错的。\n事实：奇函数 + 偶函数，除非其中一个恒为 0，否则结果既不是奇函数也不是偶函数。\n证明这个事实：设 $g$ 奇、$h$ 偶、$f = g + h$。如果 $f$ 是奇函数，则 $f(-x) = -f(x)$ 即 $g(-x) + h(-x) = -g(x) - h(x)$ 即 $-g(x) + h(x) = -g(x) - h(x)$（用 $g$ 奇 $h$ 偶）即 $h(x) = -h(x)$ 即 $h \\equiv 0$。同理如果 $f$ 是偶，则 $g \\equiv 0$。所以\"奇 + 偶 = 奇 或 偶\" 必然蕴含其中一个恒为 0。\n正解\n具体到本题：$f(x) = x + x^2$。\n$f(-x) = -x + x^2$。\n$f(-x) = f(x)$？即 $-x + x^2 = x + x^2$？只有 $x = 0$ 时成立，不是恒等。所以不是偶函数。\n$f(-x) = -f(x)$？即 $-x + x^2 = -x - x^2$？只有 $x = 0$ 时成立，不是恒等。所以不是奇函数。\n答：$f(x) = x + x^2$ 既不是奇函数也不是偶函数。\n教训\n奇 + 偶 一般不再是奇也不再是偶。这是基础但是高频被错的知识点。\n考研选择题里这种陷阱反复出现：给你一个看似简单的函数，让你判断奇偶性。如果你脑子里有\"奇 + 偶 = 偶\" 这种错误规则，你会自信地选错答案。\n记住这几条铁律：\n运算 |\n结果 |\n\n奇 ± 奇 |\n奇 |\n\n偶 ± 偶 |\n偶 |\n\n奇 ± 偶 |\n既不奇也不偶（除非有一个恒为 0） |\n\n奇 × 奇 = 偶 × 偶 |\n偶 |\n\n奇 × 偶 |\n奇 |"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第2章 极限的直觉", "body": "错误命题\n\"$0.999\\ldots < 1$，因为无论你写多少个 9，结果总比 1 小。\"", "hint": "", "answer": "错在哪里\n错在混淆了\"任意有限项\"（数列 $\\{0.9, 0.99, 0.999, \\ldots\\}$ 的某一项）与\"取极限\"（数列的极限）。\n任意有限项确实小于 1：$0.9 < 1, 0.99 < 1, 0.999 < 1, \\ldots$。这没错。\n但是\"$0.999\\ldots$（无限多个 9）\" 不是数列的某一项，而是数列的极限。极限是 1。所以 $0.999\\ldots = 1$ 严格成立。\n正解\n记数列 $a_n = 1 - 10^{-n} = 0.\\underbrace{99\\ldots 9}_{n\\text{ 个}}$。\n每个 $a_n$ 严格小于 1（差为 $10^{-n} > 0$），但是\n$$\\lim_{n \\to \\infty} a_n = 1 - \\lim_{n \\to \\infty}10^{-n} = 1 - 0 = 1.$$\n\"$0.999\\ldots$\"作为无限循环小数，就是这个极限值的另一种记号，所以\n$$0.999\\ldots = \\lim_{n \\to \\infty}\\left(1 - 10^{-n}\\right) = 1.$$\n两边精确相等，不是近似。\n教训\n这个错误的本质是没区分\"数列的项\" 与\"数列的极限\"。\n数列的每一项都是一个具体的数。极限是另一种东西：是数列的\"远期目标\"，是把\"无限接近\" 精确化的结果。极限不是数列的一项，而是数列\"趋向\" 的那个数。\n类似的错误概念：\n• \"$\\lim_{x \\to 0}\\frac{\\sin x}{x} \\approx 1$。\" 错。它等于 1，不是近似等于。\n• \"$e$ 是个无理数，所以它没有精确值。\" 错。$e = \\lim_{n \\to \\infty}(1 + \\frac{1}{n})^n$，是个精确确定的数，约等于 $2.71828\\ldots$，但它的精确值是这个极限本身。\n记住：极限不是近似，极限是精确等于。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第3章 极限的严格语言", "body": "错误命题\n\"数列 $\\{a_n\\}$ 收敛于 $A$ 的定义可以写成：存在 $N$，使对任意 $\\epsilon > 0$ 与任意 $n > N$，都有 $|a_n - A| < \\epsilon$。\"", "hint": "", "answer": "错在哪里\n这正是表述 D 的形态。它把\"$\\forall \\epsilon, \\exists N$\" 颠倒为\"$\\exists N, \\forall \\epsilon$\"。\n颠倒后的命题等价于\"从第 $N + 1$ 项起 $a_n = A$\"，这比极限定义严格强得多。\n正解\n正确的极限定义是：先 $\\forall \\epsilon$，再 $\\exists N$。\n$N$ 可以依赖于 $\\epsilon$（更小的 $\\epsilon$ 一般要求更大的 $N$）。这种依赖关系是极限定义的灵魂。如果 $N$ 不依赖于 $\\epsilon$（即同一个 $N$ 对所有 $\\epsilon$ 都管用），那条件就太强了。\n教训\n$\\epsilon$-$\\delta$ 定义里的量词顺序是不可颠倒的。\n类似地，几乎所有\"任意-存在\" 的数学命题里，量词顺序都不能随便换。换了一个，命题的意思就变了。\n考研里这种\"量词顺序\" 题不算多，但是判断错就是直接 0 分。读符号化命题时一定要逐字看清量词的位置。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第4章 求极限的工具箱", "body": "错误解答\n题目：求 $\\lim_{x \\to 0}\\frac{\\sin x - x}{x^3}$。\n错误解答：\n$\\sin x \\sim x$。代入：$\\frac{x - x}{x^3} = \\frac{0}{x^3} = 0$。", "hint": "", "answer": "错在哪里\n错在加减中盲用等价无穷小。$\\sin x \\sim x$ 只保留了主项，舍弃了高阶项 $-\\frac{x^3}{6}$。当 $\\sin x$ 与 $x$ 相减时，主项消去，结果由原本被舍弃的高阶项决定。\n正解\n用 Taylor 展开：$\\sin x = x - \\frac{x^3}{6} + o(x^3)$。\n$\\sin x - x = -\\frac{x^3}{6} + o(x^3) \\sim -\\frac{x^3}{6}$。\n原极限 $= \\frac{-x^3/6}{x^3} = -\\frac{1}{6}$。\n教训\n加减项中的两个相等价的量相减时，必须用泰勒展开（保留更高阶项）。\n经验法则（必背）：\n• 乘除中相消？等价无穷小一般合法。\n• 加减中相消？等价无穷小不合法，必须泰勒。\n一种\"半安全\" 的做法\n如果你不想完全用泰勒，可以\"先化乘除再用等价\"。\n$\\sin x - x$ 没法简单凑成乘除形态，这道题只能用泰勒。\n但是 $\\tan x - \\sin x$ 可以凑：$\\tan x - \\sin x = \\tan x(1 - \\cos x) = \\frac{\\sin x}{\\cos x}(1 - \\cos x)$。\n$\\sin x \\sim x$，$1 - \\cos x \\sim \\frac{x^2}{2}$，$\\cos x \\to 1$。所以 $\\tan x - \\sin x \\sim x \\cdot \\frac{x^2}{2} = \\frac{x^3}{2}$。\n$\\frac{\\tan x - \\sin x}{x^3} \\to \\frac{1}{2}$。一致。\n教训：能凑乘除就凑，凑不了就泰勒。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第5章 连续性", "body": "错误命题\n\"设 $f(x)$ 在 $(0, 1)$ 上连续。则 $f$ 一定有最大值（用最值定理）。\"", "hint": "", "answer": "错在哪里\n最值定理的条件是\"闭区间\"，不是\"开区间\"。$(0, 1)$ 是开区间，定理不适用。\n反例\n反例 1：$f(x) = x$ 在 $(0, 1)$ 上连续，$\\sup f = 1$，但 $1 \\notin (0, 1)$，没有最大值。\n反例 2：$f(x) = \\frac{1}{x(1 - x)}$ 在 $(0, 1)$ 上连续，但向两端趋于 $+\\infty$，根本没有上界，更没有最大值。\n反例 3：$f(x) = \\arctan\\frac{1}{x(1-x)}$ 在 $(0, 1)$ 上连续，向两端 $x \\to 0^+$ 与 $x \\to 1^-$ 时 $\\frac{1}{x(1-x)}$ 趋 $+\\infty$，故 $f \\to \\pi/2$；在 $x = 1/2$ 处 $f = \\arctan 4 < \\pi/2$。$\\sup f = \\pi/2$，但取不到——因为 $\\arctan$ 严格单增，$\\arctan(\\text{有限正数}) < \\pi/2$。这是\"上确界存在但不被取到\" 的标准开区间反例（区别于反例 2 的\"无界\"型）。\n正解\n题目本身命题错误。可以修正为以下任一形式：\n(a) \"若 $f$ 在 $[0, 1]$ 上连续，则有最大值\"，闭区间，OK。\n(b) \"若 $f$ 在 $(0, 1)$ 上连续且 $\\lim_{x \\to 0^+} f(x), \\lim_{x \\to 1^-} f(x)$ 都存在有限\"，通过额外条件让 $f$ 可以连续延拓到 $[0, 1]$，再用最值定理。\n(c) \"若 $f$ 在 $\\mathbb R$ 上连续且 $\\lim_{x \\to \\pm\\infty} f(x) = 0$\"，通过\"远处趋零\" 让最值在某有限区间内取得。\n教训\n三大性质必须严格验证\"闭区间 + 连续\" 两个条件。考研选择题最常见的错误就是把\"闭\" 漏掉，或者把\"连续\" 漏掉。每年都有大量考生在这里失分。\n习惯：每用一次最值定理、有界性定理、零点定理（介值定理），都自检\"区间闭吗？连续吗？\""}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第6章 导数：瞬时变化率", "body": "错误解答\n题目：设 $f$ 在 $x_0 = 1$ 处可导，$f'(1) = 2$。求\n$$\\lim_{h \\to 0}\\frac{f(1 + 2h) - f(1 - h)}{h}.$$\n错误解答：\n\"分子是 $f$ 在两个位置的差，应该等于 $f'$ 的差。所以等于 $0$？\"\n或者：\n\"$f(1 + 2h) - f(1 - h) \\approx f'(1) \\cdot (1 + 2h - (1 - h)) = f'(1) \\cdot 3h$。所以原极限 $\\approx \\frac{3h \\cdot 2}{h} = 6$？\"", "hint": "", "answer": "错在哪里\n第一个解答完全错（\"差应该等于 $f'$ 的差\" 没有道理）。\n第二个解答用了\"线性逼近\" 直觉，结果数值上偶然对（看下面正解），但是推理过程不严谨：因为它把 $f$ 在不同两点的差近似为\"导数乘距离\"，但是这个\"距离\" 应该指两个 $x$ 值的差，而不是\"$\\Delta x$\"。这种含糊推理在简单题上可能蒙对，复杂题上一定出错。\n正解（用例 6.3 的标准方法）\n把分子拆成两个差商：\n$$f(1 + 2h) - f(1 - h) = [f(1 + 2h) - f(1)] - [f(1 - h) - f(1)].$$\n第一项：$\\frac{f(1 + 2h) - f(1)}{h} = 2 \\cdot \\frac{f(1 + 2h) - f(1)}{2h} \\to 2 f'(1) = 4$。\n第二项：$\\frac{f(1 - h) - f(1)}{h}$。设 $t = -h$：$\\frac{f(1 + t) - f(1)}{-t} = -\\frac{f(1 + t) - f(1)}{t} \\to -f'(1) = -2$。\n合：$4 - (-2) = 6$。\n教训\n\"导数定义的变形\" 题，关键是把分子拆成两个差商，每个差商凑成 $\\frac{f(x_0 + \\alpha) - f(x_0)}{\\alpha}$ 的标准形态（注意 $\\alpha$ 可能是 $2h, -h, 3h$ 等）。然后用 $f'(x_0)$ 表达。\n考研里这种题非常常见，每年都有大量考生在这里失分。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第7章 求导工具箱", "body": "错误解答\n题目：求 $y = (3x^2 + 1)^5$ 的导数。\n错误解答：$y' = 5(3x^2 + 1)^4$。", "hint": "", "answer": "错在哪里\n漏掉了内层 $(3x^2 + 1)' = 6x$。\n正解\n$y' = 5(3x^2 + 1)^4 \\cdot 6x = 30x(3x^2 + 1)^4$。\n教训\n链式法则的结构：\n$$\\frac{d}{dx}[g(x)]^n = n[g(x)]^{n-1} \\cdot g'(x).$$\n每次复合都要乘上内层导数。\n记忆口诀：复合函数求导 = 从外向内逐层剥 = 每层乘上对应导数 = 不漏任何一层。\n考研每年第一道大题里都有几道求导题，链式法则是必考的。链式法则漏内层 = 直接扣分。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第8章 微分", "body": "错误解答\n题目：求 $y = x^3$ 在 $x = 1$ 处当 $\\Delta x = 0.1$ 时的增量 $\\Delta y$。\n错误解答：$\\Delta y = y'(1) \\cdot \\Delta x = 3 \\cdot 0.1 = 0.3$。", "hint": "", "answer": "错在哪里\n$0.3$ 是微分 $dy$，不是增量 $\\Delta y$。两者只在 $\\Delta x$ 很小时近似相等。\n考研填空题里\"求 $\\Delta y$\" 与\"求 $dy$\" 是两个不同问题，要求精确表达式还是线性逼近。\n正解\n$\\Delta y = (1 + 0.1)^3 - 1^3 = 1.331 - 1 = 0.331$。\n$dy = y'(1) \\cdot \\Delta x = 0.3$。\n两者差 $\\Delta y - dy = 0.031$，约为 $\\Delta x^2$ 量级（$0.01$）的常数倍。\n教训\n• $\\Delta y$ = 真实增量 = $f(x + \\Delta x) - f(x)$。\n• $dy$ = 微分 = $f'(x)\\Delta x$ = 线性逼近。\n• $\\Delta y \\approx dy$（小 $\\Delta x$ 时）。\n考试题问\"$\\Delta y$\" 时给精确表达式；问\"$dy$\" 时给线性逼近。两者要分清。\n更深一层：$\\Delta y - dy = O(\\Delta x^2)$ 这个误差结构来自 Taylor 展开的二阶项（第 9 章会精确讲）。所以微分是 Taylor 展开的\"一阶截断\"，是\"光滑函数 = 多项式 + 高阶小量\" 这一全局思想的最简单情形。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第9章 微分中值定理", "body": "错误解答\n题目：设 $f$ 在 $(0, 1)$ 上可导，$f(0) = f(1) = 0$。证明存在 $\\xi \\in (0, 1)$ 使 $f'(\\xi) = 0$。\n错误解答：由 Rolle 定理直接得证。", "hint": "", "answer": "错在哪里\n题目只说\"在 $(0, 1)$ 上可导\"。这是开区间，没说\"在 $[0, 1]$ 上连续\"。Rolle 定理要求闭区间连续。\n正解\n需要先补全条件：\n(1) \"$f$ 在 $(0, 1)$ 上可导\" $\\Rightarrow$ $f$ 在 $(0, 1)$ 上连续（可导蕴含连续）。\n(2) 题目要求 $f(0) = f(1) = 0$，所以$f$ 在 $0, 1$ 处有定义——但题目没说 $f$ 在 $0, 1$ 处是否连续。如果题目隐含 $f$ 在 $[0, 1]$ 上连续（许多考研题这样设定），那么 Rolle 三条件全满足，结论成立：$\\exists \\xi \\in (0, 1)$ 使 $f'(\\xi) = 0$。\n(3) 如果题目真的只给开区间可导且端点单独定义（$f(0), f(1)$ 是离散值），那 Rolle 不能用——需要额外的连续性论证。常见做法：用极限论证 $\\lim_{x\\to 0^+}f(x) = 0$ 与 $f(0) = 0$ 是否一致，以补全闭区间连续。\n严谨写法：\"由 $f$ 在 $(0, 1)$ 可导知 $f$ 在 $(0, 1)$ 连续。进一步假设 $f$ 在 $[0, 1]$ 连续（即 $\\lim_{x\\to 0^+}f(x) = f(0) = 0, \\lim_{x\\to 1^-}f(x) = f(1) = 0$）。三条件满足，由 Rolle 定理 $\\exists\\xi \\in (0,1)$ 使 $f'(\\xi) = 0$。\"\n考研答题时先在草稿上明确写出三条件验证——这是避免漏条件的最有效习惯。\n教训\n用 Rolle 定理前必须严格验证三个条件：闭区间连续、开区间可导、两端值相等。\n条件不全则定理不可用，即使结论可能仍正确（依其他条件）。考研改卷里\"Rolle 条件验证不全\" 是经典扣分点。每年都有大量考生在这里扣 2-3 分。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第10章 L'Hospital 法则与不定式", "body": "错误解答\n题目：$\\lim_{x \\to \\infty}\\frac{x + \\sin x}{x - \\cos x}$。\n错误解答：用 L'Hospital：$\\lim\\frac{1 + \\cos x}{1 + \\sin x}$。分子分母都震荡，极限不存在。所以原极限不存在。", "hint": "", "answer": "错在哪里\nL'Hospital 给的\"导数比极限不存在\" 不能反推\"原极限不存在\"。\n正解\n$$\\frac{x + \\sin x}{x - \\cos x} = \\frac{1 + \\sin x/x}{1 - \\cos x/x}.$$\n$\\sin x / x \\to 0, \\cos x / x \\to 0$（有界 × 无穷小）。所以原极限 $= \\frac{1 + 0}{1 - 0} = 1$。\n教训\nL'Hospital 是\"条件 → 结论\" 型工具：\n• 条件满足 → 结论成立。\n• 条件不满足 → 不能用法则。\n• 法则给的极限不存在 ≠ 原极限不存在。\n考研里\"洛后极限不存在\" 的题，要回到原式用其他方法重新分析。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第11章 函数的形态分析", "body": "错误解答\n题目：求 $f(x) = x^3$ 在 $x = 0$ 处的极值情况。\n错误解答：$f'(0) = 0$，所以是极值点。$f(0) = 0$ 是极值。", "hint": "", "answer": "错在哪里\n驻点是极值的必要条件，不是充分条件。\n正解\n$f'(x) = 3x^2 \\ge 0$ 对所有 $x$ 成立。所以 $f$ 单调不减（实际严格递增）。严格单调函数没有极值。\n第二充分条件：$f''(0) = 0$。失效。回到第一充分条件：$f'$ 在 $x = 0$ 两侧都 $\\ge 0$，不变号，所以不是极值。\n$x = 0$ 在几何上叫\"水平拐点\"（horizontal inflection）：切线水平但不是极值，曲线在该点穿过切线。\n教训\n求极值的标准三步：\n• 求驻点和不可导点（极值候选）。\n• 用第一或第二充分条件验证。\n• 第二条件失效时回第一条件。\n考研里\"驻点 = 极值\" 是高频错误。做题时养成习惯：找到驻点后必须验证是不是极值，不能跳过这一步。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第12章 最优化应用与曲率", "body": "错误解答\n题目：求 $f(x) = x e^{-x}$ 在 $[0, +\\infty)$ 上的最大值。\n错误解答：$f'(x) = e^{-x}(1 - x) = 0 \\iff x = 1$。$f(1) = 1/e$。最大值 $1/e$。", "hint": "", "answer": "错在哪里\n虽然结论正确，但解答不完整：没有验证\"$1/e$ 是全局最大\"。在无界区间上，候选还包括端点 $x = 0$ 与\"$x \\to +\\infty$\" 极限。\n正解（补充）\n$f(0) = 0, f(1) = 1/e \\approx 0.368, \\lim_{x \\to +\\infty} f = 0$。\n比较 $0 < 1/e$，所以 $1/e$ 是全局最大。\n教训\n求最值的标准三步：\n• 找极值候选（驻点 $\\cup$ 不可导点）。\n• 找端点候选（端点 $\\cup$ 区间趋向极限）。\n• 比较所有候选，验证全局最大/最小。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第13章 不定积分", "body": "错误解答\n题目：$\\int\\cos(2x + 3) dx$。\n错误解答：$\\sin(2x + 3) + C$。", "hint": "", "answer": "错在哪里\n凑 $d(2x + 3) = 2 dx$ 时漏掉了 $\\frac{1}{2}$。\n正解\n$\\int\\cos(2x + 3) dx = \\frac{1}{2}\\int\\cos(2x + 3) d(2x + 3) = \\frac{1}{2}\\sin(2x + 3) + C$。\n教训\n每做一个不定积分都该\"反求导验证\"，是好习惯。\n$\\frac{d}{dx}\\left[\\frac{1}{2}\\sin(2x + 3)\\right] = \\frac{1}{2}\\cos(2x + 3) \\cdot 2 = \\cos(2x + 3)$。对。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第14章 定积分：累积的艺术", "body": "错误解答\n题目：$\\int_{-1}^2 x^3 dx$。\n错误解答：$x^3$ 是奇函数，$\\int_{-1}^2 x^3 dx = 0$。", "hint": "", "answer": "错在哪里\n奇函数的积分为零要求\"积分区间关于原点对称\"。$[-1, 2]$ 不对称。\n正解\n$\\int_{-1}^2 x^3 dx = \\frac{x^4}{4}\\Big|_{-1}^2 = 4 - \\frac{1}{4} = \\frac{15}{4}$。\n分段看更清楚：$[-1, 1]$ 关于原点对称，$\\int_{-1}^{0} x^3 dx = -\\frac{1}{4}$ 与 $\\int_0^1 x^3 dx = \\frac{1}{4}$ 相消；剩下的 $[1, 2]$ 一段没有对象可消，$\\int_1^2 x^3 dx = 4 - \\frac{1}{4} = \\frac{15}{4}$，正是答案。\n![image](/library-figures/kaoyan-math-calculus-zh/fig-ch14-03.0f1f9eeb2037.svg) Zoom in\n图 14-3　[−1, 0] 上的 −1/4 只与 [0, 1] 上的 +1/4 相消；[1, 2] 上的 15/4 没有对象可消，它就是积分值。\n教训\n应用奇偶性对称必须验证：(1) 函数奇/偶；(2) 区间关于原点对称。两条都满足才能用。\n考研里这种\"看到奇函数就直接写 0\" 的草率应用是高频扣分点。养成习惯：验证两个条件后再用对称性。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第15章 定积分的应用", "body": "错误解答\n题目：$y = x^2$（$0 \\le x \\le 1$）绕 $y$ 轴的旋转体体积。\n错误解答：$V = \\pi\\int_0^1(x^2)^2 dx = \\frac{\\pi}{5}$。", "hint": "", "answer": "错在哪里\n题目要求绕 $y$ 轴，应该用圆柱壳法或者反求 $x = \\sqrt y$ 用圆盘法。错答把\"绕 $x$ 轴\" 公式套到\"绕 $y$ 轴\" 题上。\n正解\n绕 $y$ 轴，圆柱壳法：\n$V = 2\\pi\\int_0^1 x \\cdot x^2 dx = 2\\pi\\int_0^1 x^3 dx = \\frac{\\pi}{2}$。\n或绕 $y$ 轴 + 圆盘法（$y \\in [0, 1]$，截面是圆环 $\\sqrt y \\le x \\le 1$）：\n$V = \\pi\\int_0^1[1^2 - (\\sqrt y)^2] dy = \\pi\\int_0^1(1 - y) dy = \\frac{\\pi}{2}$。\n两法答案一致。\n两种算法切的是同一块平面区域（$y = x^2$ 之下、$x$ 轴之上、$0 \\le x \\le 1$），只是细条方向不同。竖条平行于旋转轴：它在 $x$ 处，到 $y$ 轴的距离是 $x$，高 $x^2$，绕 $y$ 轴转一圈成为圆柱壳。横条垂直于旋转轴：它在高度 $y$ 处，从 $x = \\sqrt y$ 伸到 $x = 1$，绕 $y$ 轴转一圈成为圆环，内半径 $\\sqrt y$、外半径 1。错答的 $\\pi\\int_0^1(x^2)^2 dx$ 算的是竖条绕 $x$ 轴转成的圆盘——转错了轴。\n![image](/library-figures/kaoyan-math-calculus-zh/fig-ch15-06.1a8374cfe9cb.svg) Zoom in\n图 15-5　同一块区域的两种切法：竖条平行于旋转轴，转成圆柱壳；横条垂直于旋转轴，转成圆环。\n教训\n旋转体体积要分清绕哪个轴。圆盘法（垂直旋转轴的截面是圆盘）vs 圆柱壳法（平行旋转轴的薄壳）。\n记忆口诀：\n• 绕 $x$ 轴 → 用 $x$ 切片 → 圆盘法 → $\\pi\\int f^2 dx$。\n• 绕 $y$ 轴 → 用 $x$ 切壳 → 圆柱壳法 → $2\\pi\\int x f dx$。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第16章 反常积分", "body": "错误解答\n题目：$\\int_{-1}^1\\frac{dx}{x^2}$。\n错误解答：$-\\frac{1}{x}\\Big|_{-1}^1 = -1 - 1 = -2$。", "hint": "", "answer": "错在哪里\n$\\frac{1}{x^2}$ 在 $x = 0$ 处趋无穷。0 在区间内部。直接代 Newton-Leibniz 不合法。\n被积函数 $\\frac{1}{x^2} \\ge 0$，积分（如果存在）必非负。$-2 < 0$ 必然错。这是个\"快速验错\" 的好习惯：积分被积函数的符号决定积分值的符号；如果符号矛盾，必有错。\n正解\n拆为瑕积分：$\\int_{-1}^1\\frac{dx}{x^2} = \\int_{-1}^0 + \\int_0^1$。每个都是 $q = 2 \\ge 1$ 瑕积分，发散。\n所以 $\\int_{-1}^1\\frac{dx}{x^2}$ 发散。\n教训\n碰到积分区间含 $f$ 不连续点（特别是趋无穷的瑕点）时：\n• 必须把积分拆开，每段单独按反常积分定义考察。\n• 不能直接用 Newton-Leibniz 公式。\n考研里这是高频陷阱题。每年都有大量考生在这种\"区间含瑕点\" 的积分上失分。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第18章 多元函数微分学", "body": "错误解答\n题目：判断 $f(x, y) = \\begin{cases}\\frac{xy}{x^2+y^2}, & (x, y) \\ne (0, 0) \\\\ 0, & (x, y) = (0, 0)\\end{cases}$ 在 $(0, 0)$ 处是否可微。\n错误解答：$f_x(0, 0) = 0, f_y(0, 0) = 0$，所以可微。", "hint": "", "answer": "错在哪里\n多元情形\"偏导存在 ≠ 可微\"。\n可微要求 $\\Delta f - f_x \\Delta x - f_y \\Delta y = o(\\rho)$。本题 $f_x = f_y = 0$，所以\"线性主项 = 0\"。但 $\\Delta f$ 不是 $o(\\rho)$：\n沿 $y = x$：$f(x, x) - 0 = \\frac{1}{2}$。$\\rho = \\sqrt 2 |x|$。$\\frac{\\Delta f}{\\rho} = \\frac{1/2}{\\sqrt 2 |x|} \\to \\infty$。\n所以 $\\Delta f \\ne o(\\rho)$，不可微。事实上 $f$ 在 $(0, 0)$ 处不连续，更不用说可微。\n正解\n$f(x, y)$ 在 $(0, 0)$ 处不可微。\n完整论证三步：\n• 算两个偏导（按定义）：$f_x(0, 0) = \\lim_{\\Delta x \\to 0}\\dfrac{f(\\Delta x, 0) - 0}{\\Delta x} = 0$，同理 $f_y(0, 0) = 0$。✓\n• 算\"线性化余项\"：$R(\\Delta x, \\Delta y) := \\Delta f - f_x\\Delta x - f_y\\Delta y = f(\\Delta x, \\Delta y) - 0 = \\dfrac{\\Delta x\\Delta y}{\\Delta x^2 + \\Delta y^2}$。\n• 看 $\\dfrac{R}{\\rho}$ 是否 $\\to 0$：取 $\\Delta y = \\Delta x = t \\to 0$：$\\dfrac{R}{\\rho} = \\dfrac{t^2/(2t^2)}{\\sqrt 2 |t|} = \\dfrac{1/2}{\\sqrt 2|t|} \\to +\\infty$。\n$R \\ne o(\\rho)$，不可微。\n更深一步：本题 $f$ 沿不同路径趋 $(0, 0)$ 给不同极限（沿 $y = kx$ 趋 $\\dfrac{k}{1+k^2}$），所以 $\\lim_{(x,y)\\to(0,0)}f$ 不存在 $\\Rightarrow$ $f$ 在 $(0, 0)$ 不连续 $\\Rightarrow$ 不可能可微（可微 $\\Rightarrow$ 连续）。两条独立路径都证实\"不可微\"。\n教训\n判别可微：检查 $\\lim_{(\\Delta x, \\Delta y) \\to (0, 0)}\\frac{\\Delta z - f_x\\Delta x - f_y\\Delta y}{\\sqrt{\\Delta x^2 + \\Delta y^2}} = 0$。\n考研里\"偏导存在但不可微\" 是经典反例。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第19章 多元函数极值", "body": "错误解答\n题目：求 $f = x^2 - y^2$ 在 $(0, 0)$ 处是否取极值。\n错误解答：$f_x(0,0) = 0, f_y(0,0) = 0$，驻点。$f(0, 0) = 0$ 是极值。", "hint": "", "answer": "错在哪里\n驻点 $\\not\\Rightarrow$ 极值。要用 Hessian。\n$A = 2, B = 0, C = -2$。$\\Delta = -4 < 0$。鞍点。\n几何理解\n沿 $y = 0$：$f = x^2 \\ge 0$，$(0, 0)$ 是局部极小（沿这条路径）。\n沿 $x = 0$：$f = -y^2 \\le 0$，$(0, 0)$ 是局部极大。\n两条路径相反结果，所以既不是极大也不是极小。这就是\"鞍点\"——形如马鞍中央。\n教训\n多元情形：\n• $\\nabla f = 0$ 必要不充分。\n• Hessian 正定 → 极小；负定 → 极大；不定 → 鞍点；半定 → 失效。\n每年都有大量考生在这里失分。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第20章 二重积分", "body": "错误解答\n题目：$\\int_0^1 dx \\int_x^1\\sin(y^2) dy$ 改换序求值。\n错误：把 $D$ 写成 $0 \\le y \\le 1, 0 \\le x \\le 1$。改换：$\\int_0^1 dy \\int_0^1\\sin(y^2) dx = \\int_0^1\\sin(y^2) dy$，但是 $\\int\\sin(y^2) dy$ 不可初等，无解。", "hint": "", "answer": "错在哪里\n$D = \\{(x, y) : 0 \\le x \\le 1, x \\le y \\le 1\\}$。Y 型描述：$0 \\le y \\le 1, 0 \\le x \\le y$。\n错答里 \"$0 \\le x \\le 1$\" 是错的——它丢掉了\"$x \\le y$\" 这个约束，把 $D$ 错描述成了整个单位正方形。\n正解\nY 型：$\\int_0^1 dy\\int_0^y\\sin(y^2) dx = \\int_0^1 y\\sin(y^2) dy = -\\frac{1}{2}\\cos(y^2)\\Big|_0^1 = \\frac{1 - \\cos 1}{2}$。\n教训\n换序三步：\n• 画图或写出 $D$ 的代数描述（用不等式集合）。\n• 从原 X 型描述读出图形。如 \"$0 \\le x \\le 1, x \\le y \\le 1$\" 是单位正方形里 $y \\ge x$ 的部分（上三角）。\n• 改写 Y 型：$x$ 上下界是 $y$ 的函数。如 \"$y \\ge x$\" 在 Y 型里变成 \"$x \\le y$\"。\n错处常在第 3 步：\"$x$ 上下界是 $y$ 的函数\" 这一点经常被忽视。考场上养成习惯：画一张 $D$ 的草图（即使简单的草图），换序就不会错。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第27章 常微分方程基础", "body": "错误解答\n题目：$\\frac{dy}{dx} = y^2 - y$ 的通解。\n错误：分离 $\\frac{dy}{y(y-1)} = dx$，部分分式 $\\frac{1}{y(y-1)} = -\\frac{1}{y} + \\frac{1}{y-1}$。\n积分 $\\ln|(y-1)/y| = x + C_1$，$\\frac{y-1}{y} = Ce^x$，$y = \\frac{1}{1 - Ce^x}$。", "hint": "", "answer": "错在哪里\n变量分离时除以 $y(y-1)$ 假设 $y \\ne 0, y \\ne 1$。但 $y \\equiv 0$ 与 $y \\equiv 1$ 也满足原方程（验证：左 = 0, 右 = 0）！\n$y \\equiv 1$ 对应 $C = 0$（在通解 $y = \\frac{1}{1 - Ce^x}$ 中）。\n$y \\equiv 0$ 不在 通解中（无论 $C$ 取何值都不能让 $y = 0$）。\n正解\n通解 $y = \\frac{1}{1 - Ce^x}$ + 额外解 $y \\equiv 0$。\n教训\n变量分离前如果除以 $g(y)$，要单独检查 $g(y) = 0$ 的解。\n常数解（\"平衡解\"、\"奇异解\"）经常是这种\"额外\" 解。它们对应物理系统的\"稳态\"（如 Logistic 方程的 $N \\equiv 0$ 是\"灭绝稳态\"，$N \\equiv K$ 是\"承载量稳态\"）。\n考场上养成习惯：分离前先看一下 $g(y) = 0$（被分离的\"分母\" 等于零）有没有\"常数解\"。"}, {"tag": "误区博物馆", "bg": "#fffbeb", "br": "#fcd34d", "fg": "#d97706", "note": "来源：第28章 高阶微分方程与差分方程", "body": "错误解答\n题目：$y'' - 5y' + 6y = e^{2x}$ 的特解。\n错误：试 $y^* = A e^{2x}$。代入 $4A - 10A + 6A = 1 \\Rightarrow 0 = 1$，矛盾。", "hint": "", "answer": "错在哪里\n$\\lambda = 2$ 是单特征根（齐次特征根 $r = 2, 3$）。共振 情形必须升幂为 $x e^{2x}$。\n如果不升幂，$e^{2x}$ 已经是齐次解，代入齐次部分等于零，无法平衡右边的 $e^{2x}$。\n正解\n试 $y^* = A x e^{2x}$（如例 28.8）。$A = -1, y^* = -x e^{2x}$。\n教训\n待定系数法的\"升幂规则\"：\n$\\lambda$ 与特征根关系 |\n升幂 |\n\n$\\lambda$ 不是特征根 |\n$y^* = A e^{\\lambda x}$ |\n\n$\\lambda$ 是单特征根 |\n$y^* = A x e^{\\lambda x}$（升一次） |\n\n$\\lambda$ 是重特征根 |\n$y^* = A x^2 e^{\\lambda x}$（升两次） |\n类似规则适用于多项式与三角自由项。\n考研经典扣分点：每年都有大量考生忘记\"共振升幂\"，导致代入后矛盾，整道题失分。\n养成习惯：写特解前先看\"$\\lambda$ 是不是特征根\"。是 → 升幂。"}]}, {"id": "zg100", "name": "猪狗冲刺 100 题", "cnt": 100, "probs": [{"tag": "极限计算", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 1】求极限 $\\operatorname* { l i m } _ { x \\to 0 } { \\frac { 1 + \\int _ { 0 } ^ { x } e ^ { t ^ { 2 } } \\mathrm { d } t } { \\sin x } } - { \\frac { 1 } { e ^ { x } - 1 } }$", "hint": "", "ts": "01:10", "video": "https://www.bilibili.com/video/BV1pNyWzAE2f?t=70", "bv": "BV1pNyWzAE2f", "answer": "B站精讲时间帧：《27考研数学最后一轮大冲刺 1/4》 01:10（点击下方「▶ B站视频 · 01:10」可直接空降该题讲解）"}, {"tag": "极限计算", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 2】求极限 $\\operatorname* { l i m } _ { x \\to 0 } { \\frac { \\sqrt [ 3 ] { 2 - \\cos x } - 1 - { \\frac { 1 } { 6 } } x ^ { 2 } } { x ^ { 4 } + \\sin ^ { 5 } x } }$", "hint": "", "ts": "03:10", "video": "https://www.bilibili.com/video/BV1pNyWzAE2f?t=190", "bv": "BV1pNyWzAE2f", "answer": "B站精讲时间帧：《27考研数学最后一轮大冲刺 1/4》 03:10（点击下方「▶ B站视频 · 03:10」可直接空降该题讲解）"}, {"tag": "极限存
