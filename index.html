拉方程 $x^2y''+xy'-4y=0$ 满足条件 $y(1)=1,\\ y'(1)=2$ 的特解。", "hint": ""}, {"tag": "数项级数 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 61】 设 $a _ { 1 } = 2$ $a _ { n + 1 } = { \\frac { 1 } { 2 } } \\left( a _ { n } + { \\frac { 1 } { a _ { n } } } \\right) ( n = 1 , 2 , \\ldots )$ ，证明： $\\operatorname* { l i m } _ { n \\to \\infty } a _ { n }$ 存在且 $\\sum _ { n = 1 } ^ { \\infty } \\left( { \\frac { a _ { n } } { a _ { n + 1 } } } - 1 \\right)$ 收敛.", "hint": ""}, {"tag": "数项级数", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 62】设 $u _ { n } \\neq 0$ ，且 $\\operatorname* { l i m } _ { n \\to \\infty } { \\frac { n } { u _ { n } } } = 1$ ，则级数 $\\sum _ { n = 1 } ^ { \\infty } ( - 1 ) ^ { n + 1 } { \\bigg ( } { \\frac { 1 } { u _ { n } } } + { \\frac { 1 } { u _ { n + 1 } } } { \\bigg ) }$ （ ）.A.绝对收敛 B.条件收敛 C.发散 D.无法判断", "hint": ""}, {"tag": "数项级数", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 63】已知 $\\sum (-1)^{n-1}\\frac{1}{n^{2-\\alpha}}$ 绝对收敛，$\\sum (-1)^n\\frac{1}{n^\\alpha(\\ln n)^2}$ 条件收敛，求 $\\alpha$ 的范围。", "hint": ""}, {"tag": "数项级数 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 64】设可导函数 $f(x)$ 满足 $f(0)=1,\\ 0<f'(x)<\\frac{1}{2}$。数列 $\\{x_n\\}$ 满足 $x_{n+1}=f(x_n)\\ (n\\geqslant 1)$。\n证明：（1）$\\sum_{n=1}^{\\infty}(x_{n+1}-x_n)$ 绝对收敛；（2）$\\lim_{n\\to\\infty}x_n$ 存在且 $0<\\lim_{n\\to\\infty}x_n<2$。", "hint": ""}, {"tag": "数项级数", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 65】判断级数 $\\sum\\ln\\left(1+\\frac{(-1)^n}{n}\\right)$ 与 $\\sum\\ln\\left(1+\\frac{(-1)^n}{\\sqrt{n}}\\right)$ 的敛散性。", "hint": ""}, {"tag": "幂级数", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 66】若级数 $\\sum_{n=1}^{\\infty}a_n$ 条件收敛，判断幂级数 $\\sum_{n=1}^{\\infty}na_n(x-1)^n$ 在 $x=\\sqrt{3}$、$x=3$ 的敛散性。", "hint": ""}, {"tag": "幂级数", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 67】求幂级数 $\\sum _ { n = 0 } ^ { \\infty } { \\frac { ( - 4 ) ^ { n } + 1 } { 4 ^ { n } ( 2 n + 1 ) } } x ^ { 2 n }$ 的和函数.", "hint": ""}, {"tag": "幂级数", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 68】已知幂级数 $\\sum _ { n = 0 } ^ { \\infty } a _ { n } x ^ { n }$ 的和函数为 $\\ln \\left( 2 + x \\right)$ ，求 $\\sum _ { n = 1 } ^ { \\infty } n a _ { 2 n }$", "hint": ""}, {"tag": "幂级数 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 69】数列 $\\{a_n\\}$ 满足 $a_0=0,\\ a_1=1,\\ a_{n+1}=3a_n-2a_{n-1}\\ (n=1,2,\\ldots)$，$S(x)=\\sum_{n=0}^{\\infty}\\frac{a_n}{n!}x^n$，求出 $S(x)$ 满足的二阶方程，并据此求出 $S(x)$ 及 $a_n$。", "hint": ""}, {"tag": "数三专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 70】某厂商在市场销售产品 $A$，且以利润最大化为生产目标。\n（1）若价格函数为 $P(Q)=100-2Q,\\ C(Q)=20Q+3Q^2$，$Q$ 为产量，求利润最大化时的价格 $P^*=P(Q^*)$ 及此时的边际成本 $MC$；\n（2）在（1）的条件下，求出利润最大化时的需求弹性 $\\eta>0$，并叙述其经济意义；\n（3）勒纳指数 $L=\\frac{P^*-MC(Q^*)}{P^*}$ 是反映市场垄断程度的重要指标，证明：$L=\\frac{1}{\\eta}\\ (\\eta>0)$，其中 $\\eta$ 为利润最大化时的需求弹性。", "hint": ""}, {"tag": "数一冷门考点", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 71】方程 $xy+z\\ln y+e^{xz}=1$ 在点 $(0,1,1)$ 的邻域是否可以确定以 $x$，$y$ 或 $z$ 为因变量的函数？", "hint": ""}, {"tag": "数一冷门考点 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 72】写出函数 $f(x,y)=x^y$ 在 $(1,4)$ 点的二阶泰勒多项式。", "hint": ""}, {"tag": "数一冷门考点", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 73】 证明： $f ( x , y ) = \\left\\{ \\begin{array} { c c } { { \\displaystyle { \\frac { 2 x y ^ { 3 } } { x ^ { 2 } + y ^ { 4 } } } , } } & { { x ^ { 2 } + y ^ { 2 } \\ne 0 } } \\\\ { { 0 , } } & { { x ^ { 2 } + y ^ { 2 } = 0 } } \\end{array} \\right.$ 在原点处连续，任意方向导数存在但不可微.", "hint": ""}, {"tag": "数一冷门考点", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 74】设 $f(x)$ 是周期为 $2$ 的周期函数，且 $f(x)=1-x,\\ x\\in[0,1]$，\n若 $f(x)=\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}a_n\\cos n\\pi x$，求 $\\sum_{n=1}^{\\infty}a_{2n}$。", "hint": ""}, {"tag": "多元积分", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 75】设 $\\Sigma = \\{ ( x , y , z ) | x + y + z = 1 , x \\geqslant 0 , y \\geqslant 0 , z \\geqslant 0 \\}$ ，计算 $\\iint _ { \\Sigma } y ^ { 2 } \\mathrm { d } S$", "hint": ""}, {"tag": "多元积分", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 76】计算曲线积分 $\\int_L \\sin 2x\\,\\mathrm{d}x+2(x^2-1)y\\,\\mathrm{d}y$，其中 $L$ 为曲线 $y=\\sin x$ 上从点 $(\\pi,0)$ 到 $(0,0)$ 的一段。", "hint": ""}, {"tag": "多元积分", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 77】设函数 $f(x,y)$ 满足 $\\frac{\\partial f(x,y)}{\\partial x}=(2x+1)e^{2x-y}$，且 $f(0,y)=y+1$，$L_t$ 是从点 $(0,0)$ 到点 $(1,t)$ 的光滑曲线，计算曲线积分 $I(t)=\\int_{L_t}\\frac{\\partial f(x,y)}{\\partial x}\\,\\mathrm{d}x+\\frac{\\partial f(x,y)}{\\partial y}\\,\\mathrm{d}y$ 并求 $I(t)$ 的最小值。", "hint": ""}, {"tag": "多元积分 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 78】$S$ 为 $z=\\sqrt{x^2+y^2}\\ (1\\leqslant z\\leqslant 2)$ 取下侧，计算曲面积分\n$$\\iint_S (x^2y+2x-y)\\,\\mathrm{d}y\\mathrm{d}z+(y^2x+2y+x)\\,\\mathrm{d}z\\mathrm{d}x+(xyz+z)\\,\\mathrm{d}x\\mathrm{d}y.$$", "hint": ""}, {"tag": "多元积分", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 79】已知有向曲线 $L$ 是旋转抛物面 $x^2+y^2=z$ 与平面 $2x-4y+z=4$ 的交线，从 $z$ 轴正向往负向看为逆时针方向，计算曲线积分 $I=\\int_L (y-z)\\,\\mathrm{d}x+(z-x)\\,\\mathrm{d}y+(x-y)\\,\\mathrm{d}z$。", "hint": ""}, {"tag": "多元积分", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 80】设空间有界区域 $\\Omega$ 由柱面 $x^2+y^2=1$ 与平面 $z=0$ 和 $x+z=1$ 围成，$\\Sigma$ 为 $\\Omega$ 的边界曲面的外侧。计算曲面积分 $I=\\iint_{\\Sigma} 2xz\\,\\mathrm{d}y\\mathrm{d}z+xz\\cos y\\,\\mathrm{d}z\\mathrm{d}x+3yz\\sin x\\,\\mathrm{d}x\\mathrm{d}y$。", "hint": ""}, {"tag": "线代专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 81】设 $\\boldsymbol{A}=\\boldsymbol{E}-\\boldsymbol{a}\\boldsymbol{a}'$，其中 $\\boldsymbol{a}$ 为非零列向量，证明“$\\boldsymbol{A}^2=\\boldsymbol{A}$”充要于“$\\boldsymbol{a}$ 是单位向量”。", "hint": ""}, {"tag": "线代专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 82】设 $\\boldsymbol{A}$ 为 $n$ 阶方阵，$k$ 为常数，证明：$(k\\boldsymbol{A})^*=k^{n-1}\\boldsymbol{A}^*$, $(\\boldsymbol{A}^*)^*=|\\boldsymbol{A}|^{n-2}\\boldsymbol{A}\\ (n\\geqslant 2)$。", "hint": ""}, {"tag": "线代专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 83】已知 $\\boldsymbol{A}=\\begin{pmatrix}1&0&0\\\\1&1&0\\\\1&1&1\\end{pmatrix},\\ \\boldsymbol{B}=\\begin{pmatrix}0&1&1\\\\1&0&1\\\\1&1&0\\end{pmatrix}$，求矩阵 $\\boldsymbol{X}$ 使得\n$$\\boldsymbol{AXA}+\\boldsymbol{BXB}=\\boldsymbol{AXB}+\\boldsymbol{BXA}+\\boldsymbol{E}.$$", "hint": ""}, {"tag": "线代专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 84】设 $\\boldsymbol{A},\\boldsymbol{B}$ 分别为 $m\\times n,\\ n\\times s$ 型矩阵，$r(\\boldsymbol{A})=n$，则下列说法正确的是______。\n① $\\boldsymbol{AB}$ 的列向量组与 $\\boldsymbol{B}$ 的列向量组等价　② $\\boldsymbol{AB}$ 的列向量组与 $\\boldsymbol{A}$ 的列向量组等价\n③ $\\boldsymbol{AB}$ 的行向量组与 $\\boldsymbol{B}$ 的行向量组等价　④ $\\boldsymbol{AB}$ 的行向量组与 $\\boldsymbol{A}$ 的行向量组等价", "hint": ""}, {"tag": "线代专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 85】设 $n$ 阶方阵 $\\boldsymbol{A}$ 满足 $(\\boldsymbol{A}-2\\boldsymbol{E})(\\boldsymbol{A}+3\\boldsymbol{E})=\\boldsymbol{O}$，证明：$r(\\boldsymbol{A}-2\\boldsymbol{E})+r(\\boldsymbol{A}+3\\boldsymbol{E})=n$。", "hint": ""}, {"tag": "线代专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 86】设 3 阶矩阵 $\\boldsymbol{A}$ 和 $\\boldsymbol{B}$ 满足 $r(\\boldsymbol{BA})<r(\\boldsymbol{AB})$，则下列结论正确的有______。\n① $r(\\boldsymbol{A}),r(\\boldsymbol{B})<3$　② $\\boldsymbol{Ax}=\\boldsymbol{0}$ 与 $\\boldsymbol{Bx}=\\boldsymbol{0}$ 有非零公共解\n③ $\\boldsymbol{ABx}=\\boldsymbol{0}$ 与 $\\boldsymbol{BAx}=\\boldsymbol{0}$ 有非零公共解　④ $\\boldsymbol{ABAx}=\\boldsymbol{0}$ 与 $\\boldsymbol{BABx}=\\boldsymbol{0}$ 有非零公共解", "hint": ""}, {"tag": "线代专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 87】若 3 阶矩阵的特征值有一个单根 $\\lambda$ 和一个二重根 $\\mu$，则称其为“$(1,2)$ 型矩阵”，下列命题正确的有______。\n① 若 $\\boldsymbol{A}$ 为 $(1,2)$ 型矩阵，则 $\\boldsymbol{A}^*$ 也为 $(1,2)$ 型矩阵\n② 若 $\\boldsymbol{A}$ 为 $(1,2)$ 型矩阵且可逆，则 $\\boldsymbol{A}^{-1}$ 也为 $(1,2)$ 型矩阵\n③ $(1,2)$ 型矩阵可以相似对角化\n④ $(1,2)$ 型矩阵满足 $(\\boldsymbol{A}-\\lambda\\boldsymbol{E})(\\boldsymbol{A}-\\mu\\boldsymbol{E})=\\boldsymbol{O}$", "hint": ""}, {"tag": "线代专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 88】设 $\\boldsymbol{A},\\boldsymbol{B}$ 为 $n$ 阶矩阵，$\\boldsymbol{AB}=2\\boldsymbol{A}+5\\boldsymbol{B}$，且 $\\boldsymbol{A}$ 有 $n$ 个不同特征值，证明：$\\boldsymbol{A},\\boldsymbol{B}$ 特征向量完全相同。", "hint": ""}, {"tag": "线代专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 89】设实对称矩阵 $\\boldsymbol{A}$ 有二重特征值 $1$，且行和为 $0$。\n（1）求矩阵 $\\boldsymbol{A}$；\n（2）$\\boldsymbol{P}$ 为可逆矩阵，若 $\\forall\\boldsymbol{x}=(x_1,x_2,x_3)'$ 均有 $\\boldsymbol{x}'(2\\boldsymbol{E}-\\boldsymbol{A})\\boldsymbol{x}=\\|\\boldsymbol{P}\\boldsymbol{x}\\|^2$，求矩阵 $\\boldsymbol{P}$。", "hint": ""}, {"tag": "线代专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 90】设 $\\boldsymbol{A}=\\begin{pmatrix}2&1&0\\\\1&2&1\\\\0&1&2\\end{pmatrix},\\ \\boldsymbol{B}=\\begin{pmatrix}1&0&0\\\\0&1&0\\\\0&0&0\\end{pmatrix},\\ \\boldsymbol{x}=(x_1,x_2,x_3)'$，求在 $\\boldsymbol{x}'\\boldsymbol{B}\\boldsymbol{x}=1$ 条件下 $\\boldsymbol{x}'\\boldsymbol{A}\\boldsymbol{x}$ 的最大值和最小值。", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 91】若事件 $A,B$ 满足 $0<P(A)<1,\\ 0<P(B)<1$，证明：“$P(B|A)+P(\\overline{B}|\\overline{A})=1$”充要于“$A$ 与 $B$ 独立”。", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 92】动物园随机指派猪哥与狗姐参加 2027 年考研，已知猪哥和狗姐考到 450 分的概率分别为 $0.2,\\ 0.9$。\n（1）求若成绩未达到 450 分，指派狗姐参加考试的概率；\n（2）若成绩达到 450 分，指派猪哥参加考试的概率。", "hint": ""}, {"tag": "概率统计专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 93】设随机变量 $X$ 的概率密度为 $f_X(x)=\\begin{cases}2x, & 0<x<1\\\\ 0, & \\text{oth.}\\end{cases}$，在给定 $X=x\\ (0<x<1)$ 的条件下，随机变量 $Y$ 在 $(-x,x)$ 上的均匀分布。\n（1）求 $P\\left\\{\\frac{1}{2}<X<\\frac{3}{2}\\mid Y=E(Y)\\right\\}$；\n（2）判断 $X$ 与 $Y$ 的独立性、相关性。", "hint": ""}, {"tag": "概率统计专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 94】已知两灯泡寿命独立同分布于期望为 $2$ 的指数分布。第一只灯泡先亮，若 $1$ 小时内第一只灯泡坏掉，则在第 $1$ 小时时第二只灯泡才亮；若 $1$ 小时内第一只灯泡未坏掉，则在第一只灯泡坏掉时立即点亮第二只灯泡，$T$ 是第一只灯泡亮起直到第二只坏掉的时间，求 $ET$。", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 95】 已知某商场一天来的顾客数 $X \\sim P ( \\lambda )$ ，而每个来到商场的顾客购物概率为 $p$ ，证明：该商场内一天购物顾客的总数服从 $P ( \\lambda p )$", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 96】设二维连续随机变量 $( X , Y )$ 的联合密度函数为\n\n$$\nf ( x , y ) = \\left\\{ \\begin{array} { c c } { { 2 4 ( 1 - x ) y , 0 < y < x < 1 } } \\\\ { { 0 , 0 t h . } } \\end{array} \\right.\n$$\n\n在 $\\begin{array} { r } { 0 < y < 1 } \\end{array}$ 时求条件期望 $E \\big ( X | Y = y \\big )$ 和条件方差 $D ( X | Y = y )$", "hint": ""}, {"tag": "概率统计专项 · 较难", "bg": "#fef2f2", "br": "#fca5a5", "fg": "#dc2626", "note": "来源：《猪狗冲刺 100 题》（标红难题，建议吃透细节）", "body": "【例 97】设随机变量 $X$ 的分布列为 $P\\{X=1\\}=P\\{X=2\\}=1/2$，若在给定 $X=i\\ (i=1,2)$ 的条件下，$Y\\sim U(0,i)$。求 $Y$ 的分布函数与期望。", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 98】设随机变量 $X$ 的概率密度函数为\n$$f_X(x)=\\begin{cases}x, & 0\\leqslant x<1\\\\ 2-x, & 1\\leqslant x\\leqslant 2\\\\ 0, & \\text{oth.}\\end{cases},\\quad Y=\\begin{cases}0, & 0\\leqslant X<1\\\\ 1, & 1\\leqslant X\\leqslant 2\\end{cases},\\quad Z=XY.$$\n（1）求 $Z$ 的概率密度函数；\n（2）求 $\\operatorname{Cov}(X,Z)$。", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 99】为确定某城市成年男子中吸烟者的比例 $p$，任意调查 $n$ 个成年男子，记其中的吸烟人数为 $m$，问 $n$ 至少要多大，才能使得 $m/n$ 与 $p$ 的差异小于 $0.01$ 的概率大于 $95\\%$。\n参考数据：$\\varPhi(1.96)=0.975$。", "hint": ""}, {"tag": "概率统计专项", "bg": "#eff6ff", "br": "#93c5fd", "fg": "#2563eb", "note": "来源：《猪狗冲刺 100 题》", "body": "【例 100】设总体 $X$ 的分布函数为 $F(x;\\theta)=\\begin{cases}1-e^{-\\frac{x^2}{\\theta}}, & x\\geqslant 0\\\\ 0, & x<0\\end{cases}$，其中 $\\theta>0$ 为未知参数。$X_1,X_2,\\ldots,X_n$ 为来自总体 $X$ 的简单随机样本。\n（1）求 $EX$ 与 $EX^2$；\n（2）求 $\\theta$ 的最大似然估计量 $\\widehat{\\theta_n}$；\n（3）是否存在实数 $a$，使得对任何 $\\varepsilon>0$，有 $\\lim_{n\\to\\infty}P\\left\\{\\left|\\widehat{\\theta_n}-a\\right|\\geqslant\\varepsilon\\right\\}=0$。", "hint": ""}]}];</script>
<script>
(function(){
'use strict';

var DATA = window.__DATA__ || [];
var DAY_MS = 86400000;
var KNOWN_DAYS = [3, 7, 15, 30];
var CHUNK_SIZE = 24;
var GROUPS = [
  {name:'高等数学', ids:['n1','n2','n3','n4','n5','n6']},
  {name:'专题突破', ids:['nzm']},
  {name:'线性代数 · 辅导', ids:['lad','lax','law']},
  {name:'微积分 · 辅导', ids:['cax','caw']},
  {name:'冲刺专项', ids:['zg100']}
];

function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function catShort(name){ return String(name).replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/, '').replace(/大观$/, '').replace(/大合集$/, ''); }
function qidOf(c, i){ return c.id + '_' + i; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mathHtml(s){ return esc(s).replace(/\n/g,'<br>'); }

// Precompute flat index for O(1) lookups
var ALL_PROBS = [];
var KEY_MAP = Object.create(null);
var CAT_MAP = Object.create(null);
DATA.forEach(function(c){
  c._short = catShort(c.name);
  CAT_MAP[c.id] = c;
  c.probs.forEach(function(p, i){
    var key = qidOf(c, i);
    var item = {
      c: c, i: i, p: p, key: key,
      searchStr: ((p.body||'') + ' ' + (p.note||'') + ' ' + (p.hint||'') + ' ' + (p.tag||'') + ' ' + c._short).toLowerCase()
    };
    ALL_PROBS.push(item);
    KEY_MAP[key] = item;
  });
});

// Persistent state
var mastery = {};
var stars = {};
var reviewMap = {};
try { mastery = JSON.parse(localStorage.getItem('dg_mastery') || '{}'); } catch(e){ mastery = {}; }
try { stars = JSON.parse(localStorage.getItem('dg_stars') || '{}'); } catch(e){ stars = {}; }
try { reviewMap = JSON.parse(localStorage.getItem('dg_review') || '{}'); } catch(e){ reviewMap = {}; }

function saveM(){ localStorage.setItem('dg_mastery', JSON.stringify(mastery)); }
function saveS(){ localStorage.setItem('dg_stars', JSON.stringify(stars)); }
function saveR(){ localStorage.setItem('dg_review', JSON.stringify(reviewMap)); }

// Sync legacy mastery entries into reviewMap on startup
function syncLegacyReview(){
  var changed = false;
  var now = Date.now();
  for (var key in mastery) {
    if (!Object.prototype.hasOwnProperty.call(mastery, key)) continue;
    if (!reviewMap[key]) {
      var m = mastery[key];
      if (m === 'unknown') {
        reviewMap[key] = {lastAt: 0, nextAt: 0, streak: 0, count: 0, wrong: 1};
      } else if (m === 'needs') {
        reviewMap[key] = {lastAt: 0, nextAt: 0, streak: 0, count: 0, wrong: 0};
      } else if (m === 'known') {
        reviewMap[key] = {lastAt: now, nextAt: now + 3 * DAY_MS, streak: 1, count: 1, wrong: 0};
      }
      changed = true;
    }
  }
  if (changed) saveR();
}
syncLegacyReview();

var SCALES = {small:0.9, normal:1, large:1.16, xlarge:1.34};
var STATE = {
  mode: 'bank', // 'bank' | 'review' | 'starred'
  view: localStorage.getItem('dg_view') || 'multi',
  catId: DATA[0] ? DATA[0].id : 'ALL',
  idx: 0,
  scale: localStorage.getItem('dg_scale') || 'normal',
  query: '',
  reviewFilter: 'due', // 'due' | 'unknown' | 'needs' | 'known'
  shuffle: false,
  shuffleSeed: 1
};

// Toast helper
var toastTimer = null;
function showToast(msg){
  var el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

// Review helpers
function nextKnownDays(streak){
  var idx = Math.min(Math.max(0, streak), KNOWN_DAYS.length - 1);
  return KNOWN_DAYS[idx];
}

function isDue(key, now){
  var m = mastery[key];
  if (!m) return false;
  var r = reviewMap[key];
  if (!r) return m === 'unknown' || m === 'needs';
  return (r.nextAt || 0) <= now;
}

function formatDueText(key, now){
  var m = mastery[key];
  var r = reviewMap[key];
  if (!m) return '';
  if (!r || (r.nextAt || 0) <= now) {
    if (m === 'unknown') return '不会 · 待重练';
    if (m === 'needs') return '不熟练 · 今日待复习';
    return '复习到期';
  }
  var diff = r.nextAt - now;
  if (diff < 3600000) return Math.max(1, Math.ceil(diff / 60000)) + ' 分钟后复习';
  if (diff < DAY_MS) return Math.ceil(diff / 3600000) + ' 小时后复习';
  return Math.ceil(diff / DAY_MS) + ' 天后复习';
}

function setQuestionMastery(key, mm, fromReview){
  var now = Date.now();
  var prevM = mastery[key];
  var prevR = reviewMap[key] || {lastAt: 0, nextAt: 0, streak: 0, count: 0, wrong: 0};

  // Toggle off if clicking same state in bank/starred mode
  if (!fromReview && prevM === mm) {
    delete mastery[key];
    delete reviewMap[key];
    saveM(); saveR();
    return {cleared: true, msg: '已清除掌握标记'};
  }

  mastery[key] = mm;
  var rec = {
    lastAt: now,
    nextAt: now,
    streak: prevR.streak || 0,
    count: (prevR.count || 0) + (fromReview ? 1 : 0),
    wrong: prevR.wrong || 0
  };

  var msg = '';
  if (mm === 'unknown') {
    rec.streak = 0;
    rec.wrong = (prevR.wrong || 0) + 1;
    // In review mode, give a 5-min cooldown so the user advances cleanly to the next card
    rec.nextAt = fromReview ? (now + 5 * 60 * 1000) : now;
    msg = fromReview ? '已记为「不会」，5 分钟后可再次重练' : '已标记「不会」，已加入复习队列';
  } else if (mm === 'needs') {
    rec.streak = 0;
    rec.nextAt = fromReview ? (now + DAY_MS) : now;
    msg = fromReview ? '已记为「不熟练」，安排 1 天后复习' : '已标记「不熟练」，已加入复习队列';
  } else if (mm === 'known') {
    var days = nextKnownDays(rec.streak);
    rec.streak = rec.streak + 1;
    rec.nextAt = now + days * DAY_MS;
    msg = '已标记「掌握」，' + days + ' 天后复习';
  }

  reviewMap[key] = rec;
  saveM(); saveR();
  return {cleared: false, msg: msg, state: mm};
}

function getReviewStats(catId){
  var now = Date.now();
  var pool = (catId && catId !== 'ALL' && CAT_MAP[catId]) ? listForCat(catId) : ALL_PROBS;
  var due = 0, unknown = 0, needs = 0, known = 0;
  for (var k = 0; k < pool.length; k++) {
    var key = pool[k].key;
    var m = mastery[key];
    if (m === 'unknown') unknown++;
    else if (m === 'needs') needs++;
    else if (m === 'known') known++;
    if (m && isDue(key, now)) due++;
  }
  return {total: pool.length, due: due, unknown: unknown, needs: needs, known: known};
}

function updateGlobalReviewBadge(){
  var now = Date.now();
  var due = 0;
  for (var key in mastery) {
    if (Object.prototype.hasOwnProperty.call(mastery, key) && isDue(key, now)) due++;
  }
  var badge = $('#reviewBadge');
  if (badge) {
    badge.textContent = due;
    badge.classList.toggle('zero', due === 0);
  }
}

// Lists & filtering
function listForCat(id){
  if (id === 'ALL') return ALL_PROBS;
  var c = CAT_MAP[id];
  if (!c) return [];
  var out = [];
  for (var i = 0; i < c.probs.length; i++) {
    out.push(KEY_MAP[qidOf(c, i)]);
  }
  return out;
}

function deterministicShuffle(arr, seed){
  var copy = arr.slice();
  var s = seed || 1;
  for (var i = copy.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) % 4294967296;
    var j = s % (i + 1);
    var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy;
}

function currentList(){
  var base;
  var now = Date.now();
  if (STATE.mode === 'starred') {
    base = ALL_PROBS.filter(function(o){
      return !!stars[o.key] && (STATE.catId === 'ALL' || o.c.id === STATE.catId);
    });
  } else if (STATE.mode === 'review') {
    var pool = listForCat(STATE.catId);
    var rf = STATE.reviewFilter;
    base = pool.filter(function(o){
      var m = mastery[o.key];
      if (!m) return false;
      if (rf === 'due') return isDue(o.key, now);
      return m === rf;
    });
    if (rf === 'due') {
      var prio = {unknown: 0, needs: 1, known: 2};
      base.sort(function(a, b){
        var pa = prio[mastery[a.key]] !== undefined ? prio[mastery[a.key]] : 3;
        var pb = prio[mastery[b.key]] !== undefined ? prio[mastery[b.key]] : 3;
        if (pa !== pb) return pa - pb;
        var na = (reviewMap[a.key] && reviewMap[a.key].nextAt) || 0;
        var nb = (reviewMap[b.key] && reviewMap[b.key].nextAt) || 0;
        return na - nb;
      });
    }
    if (STATE.shuffle) base = deterministicShuffle(base, STATE.shuffleSeed);
  } else {
    base = listForCat(STATE.catId);
  }

  if (STATE.query) {
    var q = STATE.query.toLowerCase();
    base = base.filter(function(o){ return o.searchStr.indexOf(q) !== -1; });
  }
  return base;
}

// MathJax batched & intersection-observed typesetting
var mjQueue = new Set();
var mjRaf = 0;

function flushMathJax(){
  mjRaf = 0;
  if (!window.__mjReady || !window.MathJax || !MathJax.typesetPromise) return;
  if (!mjQueue.size) return;
  var batch = [];
  mjQueue.forEach(function(el){
    if (el.isConnected && !el.dataset.mjDone) {
      el.dataset.mjDone = '1';
      batch.push(el);
    }
  });
  mjQueue.clear();
  if (!batch.length) return;
  try {
    MathJax.typesetPromise(batch).catch(function(){});
  } catch(e){}
}

function queueTypeset(el){
  if (!el || el.dataset.mjDone) return;
  mjQueue.add(el);
  if (!mjRaf && window.__mjReady) {
    mjRaf = requestAnimationFrame(flushMathJax);
  }
}

window.__onMathJaxReady = function(){
  if (mjQueue.size && !mjRaf) {
    mjRaf = requestAnimationFrame(flushMathJax);
  }
};

var cardObserver = null;
function ensureCardObserver(){
  if (cardObserver || !('IntersectionObserver' in window)) return;
  cardObserver = new IntersectionObserver(function(entries){
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].isIntersecting) {
        var card = entries[i].target;
        var body = card.querySelector('.qbody');
        if (body) queueTypeset(body);
        cardObserver.unobserve(card);
      }
    }
  }, {root: $('#viewer'), rootMargin: '450px 0px'});
}

// Card HTML
function cardHtml(o, pos, singleAnim){
  var c = o.c, p = o.p, key = o.key;
  var tagBg = p.bg || '#eef4ff', tagBr = p.br || '#c7d2fe', tagFg = p.fg || '#2563eb';
  var starred = !!stars[key], m = mastery[key] || '';
  var now = Date.now();
  var h = '<div class="qcard' + (singleAnim ? ' single-anim' : '') + '" data-key="' + key + '">';
  h += '<div class="qhead"><span class="qno">第 ' + (pos + 1) + ' 题</span><span class="qsrc">' + esc(c._short) + '</span>';
  if (m && (STATE.mode === 'review' || reviewMap[key])) {
    var dueNow = isDue(key, now);
    h += '<span class="qrev-meta' + (dueNow ? ' due' : '') + '">' + esc(formatDueText(key, now)) + '</span>';
  }
  if (p.tag) {
    h += '<span class="qtopic" style="background:' + tagBg + ';border:1px solid ' + tagBr + ';color:' + tagFg + '">' + esc(p.tag) + '</span>';
  }
  h += '</div>';
  h += '<div class="qbody">' + mathHtml(p.body) + '</div>';
  h += '<div class="qtools">';
  h += '<button class="tool parseBtn">📖 解析</button>';
  if (p.video) {
    var lab = '▶ B站视频' + (p.ts ? (' · ' + p.ts) : '');
    h += '<a class="tool" href="' + p.video + '" target="_blank" rel="noopener" title="B站原视频 · ' + esc(p.ts || '') + '">' + esc(lab) + '</a>';
  }
  h += '<button class="star' + (starred ? ' on' : '') + '">' + (starred ? '★ 已收藏' : '☆ 收藏') + '</button>';
  h += '<div class="mgroup">';
  if (STATE.mode === 'review') {
    var r = reviewMap[key] || {};
    var kDays = nextKnownDays(r.streak || 0);
    h += '<button class="mbtn' + (m === 'unknown' ? ' act-unknown' : '') + '" data-m="unknown">不会<small>·重来</small></button>';
    h += '<button class="mbtn' + (m === 'needs' ? ' act-needs' : '') + '" data-m="needs">不熟练<small>·1天</small></button>';
    h += '<button class="mbtn' + (m === 'known' ? ' act-known' : '') + '" data-m="known">掌握<small>·' + kDays + '天</small></button>';
  } else {
    h += '<button class="mbtn' + (m === 'needs' ? ' act-needs' : '') + '" data-m="needs">不熟练</button>';
    h += '<button class="mbtn' + (m === 'unknown' ? ' act-unknown' : '') + '" data-m="unknown">不会</button>';
    h += '<button class="mbtn' + (m === 'known' ? ' act-known' : '') + '" data-m="known">掌握</button>';
  }
  h += '</div></div>';

  var parts = [];
  if (p.note) parts.push('<div class="psec"><span class="plabel">💡 笔记</span>' + mathHtml(p.note) + '</div>');
  if (p.hint) parts.push('<div class="psec"><span class="plabel p-hint">🧭 提示</span>' + mathHtml(p.hint) + '</div>');
  if (p.answer) parts.push('<div class="psec"><span class="plabel p-ans">🧩 解析</span>' + mathHtml(p.answer) + '</div>');
  if (!parts.length) parts.push('<div class="psec muted">暂无解析内容。</div>');
  h += '<div class="panel" hidden><div class="ptitle">解析 / 笔记</div>' + parts.join('') + '</div>';
  h += '</div>';
  return h;
}

// Sidebar rendering & in-place count updates
function masteredCount(c){
  var n = 0;
  for (var i = 0; i < c.probs.length; i++) {
    if (mastery[qidOf(c, i)] === 'known') n++;
  }
  return n;
}

function buildSidebar(){
  var html = '';
  GROUPS.forEach(function(g){
    var subs = g.ids.map(function(id){ return CAT_MAP[id]; }).filter(Boolean);
    if (!subs.length) return;
    html += '<div class="group" data-group="' + esc(g.name) + '"><div class="grouphead"><span>' + esc(g.name) + '</span><span class="gcount"></span></div>';
    subs.forEach(function(c){
      html += '<div class="cat" data-cat="' + c.id + '"><span class="cname">' + esc(c._short) + '</span><span class="ccount"></span></div>';
    });
    html += '</div>';
  });
  var listEl = $('#catList');
  listEl.innerHTML = html;
  listEl.addEventListener('click', function(e){
    var catEl = e.target.closest('.cat');
    if (!catEl) return;
    STATE.catId = catEl.getAttribute('data-cat');
    STATE.idx = 0;
    updateSidebarActive();
    render();
    closeDrawer();
  });
  $('#allBtn').addEventListener('click', function(){
    STATE.catId = 'ALL';
    STATE.idx = 0;
    updateSidebarActive();
    render();
    closeDrawer();
  });
  updateSidebarActive();
  updateSidebarCounts();
}

function updateSidebarActive(){
  $('#allBtn').classList.toggle('active', STATE.catId === 'ALL');
  $$('#catList .cat').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-cat') === STATE.catId);
  });
}

function updateSidebarCounts(){
  var totalKnown = 0;
  GROUPS.forEach(function(g){
    var subs = g.ids.map(function(id){ return CAT_MAP[id]; }).filter(Boolean);
    var tot = 0, mas = 0;
    subs.forEach(function(c){
      var cm = masteredCount(c);
      tot += c.probs.length;
      mas += cm;
      var cel = $('#catList .cat[data-cat="' + c.id + '"] .ccount');
      if (cel) cel.textContent = cm + ' / ' + c.probs.length;
    });
    totalKnown += mas;
    var gel = $('#catList .group[data-group="' + g.name + '"] .gcount');
    if (gel) gel.textContent = mas + ' / ' + tot;
  });
  var ac = $('#allCount');
  if (ac) ac.textContent = totalKnown + ' / ' + ALL_PROBS.length;
  updateGlobalReviewBadge();
}

function syncTabs(){
  $('#tabBank').classList.toggle('active', STATE.mode === 'bank');
  $('#tabReview').classList.toggle('active', STATE.mode === 'review');
  $('#tabStar').classList.toggle('active', STATE.mode === 'starred');
}

function reviewDashboardHtml(){
  var st = getReviewStats(STATE.catId);
  var tot = st.total || 1;
  var pKnown = (st.known / tot * 100).toFixed(2);
  var pNeeds = (st.needs / tot * 100).toFixed(2);
  var pUnknown = (st.unknown / tot * 100).toFixed(2);
  var scopeName = STATE.catId === 'ALL' ? '全部题目' : (CAT_MAP[STATE.catId] ? CAT_MAP[STATE.catId]._short : '');
  var rf = STATE.reviewFilter;

  var h = '<div class="rdash" id="reviewDash">';
  h += '<div class="rdash-top">';
  h += '<div class="rdash-title">间隔复习中心 <span class="rdash-scope">' + esc(scopeName) + ' · 共 ' + st.total + ' 题</span></div>';
  h += '<div class="rdash-actions">';
  h += '<button class="rbtn' + (STATE.shuffle ? ' active' : '') + '" id="shuffleBtn">🔀 ' + (STATE.shuffle ? '乱序中' : '顺序') + '</button>';
  h += '</div></div>';
  h += '<div class="rbar" title="掌握 ' + st.known + ' / 不熟练 ' + st.needs + ' / 不会 ' + st.unknown + '">';
  h += '<div class="rbar-seg rbar-known" style="width:' + pKnown + '%"></div>';
  h += '<div class="rbar-seg rbar-needs" style="width:' + pNeeds + '%"></div>';
  h += '<div class="rbar-seg rbar-unknown" style="width:' + pUnknown + '%"></div>';
  h += '</div>';
  h += '<div class="rfilters">';
  h += '<button class="rfpill' + (rf === 'due' ? ' active' : '') + '" data-rf="due"><span class="rflab">今日待复习</span><span class="rfnum">' + st.due + '</span></button>';
  h += '<button class="rfpill' + (rf === 'unknown' ? ' active' : '') + '" data-rf="unknown"><span class="rflab">不会</span><span class="rfnum">' + st.unknown + '</span></button>';
  h += '<button class="rfpill' + (rf === 'needs' ? ' active' : '') + '" data-rf="needs"><span class="rflab">不熟练</span><span class="rfnum">' + st.needs + '</span></button>';
  h += '<button class="rfpill' + (rf === 'known' ? ' active' : '') + '" data-rf="known"><span class="rflab">已掌握</span><span class="rfnum">' + st.known + '</span></button>';
  h += '</div></div>';
  return h;
}

// Incremental chunked rendering state for multi mode
var activeList = [];
var renderedCount = 0;
var sentinelObserver = null;

function disconnectObservers(){
  if (cardObserver) cardObserver.disconnect();
  if (sentinelObserver) { sentinelObserver.disconnect(); sentinelObserver = null; }
}

function appendNextChunk(){
  var viewer = $('#viewer');
  var sentinel = $('#loadMoreSentinel');
  if (renderedCount >= activeList.length) {
    if (sentinel) sentinel.textContent = activeList.length > CHUNK_SIZE ? ('已显示全部 ' + activeList.length + ' 题') : '';
    return;
  }
  var end = Math.min(renderedCount + CHUNK_SIZE, activeList.length);
  var html = '';
  for (var k = renderedCount; k < end; k++) {
    html += cardHtml(activeList[k], k, false);
  }
  var temp = document.createElement('div');
  temp.innerHTML = html;
  var frag = document.createDocumentFragment();
  var newCards = [];
  while (temp.firstChild) {
    var node = temp.firstChild;
    newCards.push(node);
    frag.appendChild(node);
  }
  if (sentinel) viewer.insertBefore(frag, sentinel);
  else viewer.appendChild(frag);

  ensureCardObserver();
  for (var i = 0; i < newCards.length; i++) {
    if (cardObserver) cardObserver.observe(newCards[i]);
    else queueTypeset(newCards[i].querySelector('.qbody'));
  }
  renderedCount = end;
  if (sentinel) {
    sentinel.textContent = renderedCount < activeList.length
      ? ('已加载 ' + renderedCount + ' / ' + activeList.length + ' 题，向下滚动继续加载...')
      : (activeList.length > CHUNK_SIZE ? ('已显示全部 ' + activeList.length + ' 题') : '');
  }
}

function setupSentinelObserver(){
  var sentinel = $('#loadMoreSentinel');
  if (!sentinel || !('IntersectionObserver' in window)) {
    while (renderedCount < activeList.length) appendNextChunk();
    return;
  }
  sentinelObserver = new IntersectionObserver(function(entries){
    if (entries[0] && entries[0].isIntersecting && renderedCount < activeList.length) {
      appendNextChunk();
    }
  }, {root: $('#viewer'), rootMargin: '600px 0px'});
  sentinelObserver.observe(sentinel);
}

function emptyHtml(){
  if (STATE.query) return '<div class="empty">没有找到包含「<b>' + esc(STATE.query) + '</b>」的题目。<br>试试更换关键词或清空搜索。</div>';
  if (STATE.mode === 'starred') return '<div class="empty">还没有收藏题目。<br>在题目下方点击「☆ 收藏」，把好题收进来。</div>';
  if (STATE.mode === 'review') {
    if (STATE.reviewFilter === 'due') return '<div class="empty"><b>太棒了！当前没有待复习的题目。</b><br>你可以切换到「不会 / 不熟练 / 已掌握」进行专项巩固，或回题库继续刷题并标记掌握度。</div>';
    return '<div class="empty">当前筛选下暂无题目。<br>在题库做题时点击「不会 / 不熟练 / 掌握」，系统会自动为你安排复习。</div>';
  }
  return '<div class="empty">该分类暂无题目。</div>';
}

function render(preserveScroll){
  disconnectObservers();
  mjQueue.clear();

  var list = currentList();
  activeList = list;
  renderedCount = 0;

  if (STATE.idx >= list.length) STATE.idx = list.length - 1;
  if (STATE.idx < 0) STATE.idx = 0;

  var viewer = $('#viewer');
  var prevScroll = preserveScroll ? viewer.scrollTop : 0;

  var modeLabel = STATE.mode === 'starred' ? '我的收藏' : (STATE.mode === 'review' ? '复习模式' : (STATE.catId === 'ALL' ? '全部题目' : (CAT_MAP[STATE.catId] ? CAT_MAP[STATE.catId]._short : '')));
  $('#topinfo').textContent = modeLabel + ' · ' + list.length + ' 题';

  var dashHtml = (STATE.mode === 'review') ? reviewDashboardHtml() : '';
  var pager = $('#pager');

  if (!list.length) {
    viewer.innerHTML = dashHtml + emptyHtml();
    pager.classList.add('hidden');
    $('#pos').textContent = '0 / 0';
    return;
  }

  if (STATE.view === 'single') {
    pager.classList.remove('hidden');
    viewer.innerHTML = dashHtml + cardHtml(list[STATE.idx], STATE.idx, true);
    $('#pos').textContent = (STATE.idx + 1) + ' / ' + list.length;
    $('#prev').disabled = STATE.idx <= 0;
    $('#next').disabled = STATE.idx >= list.length - 1;
    var body = viewer.querySelector('.qbody');
    if (body) queueTypeset(body);
  } else {
    pager.classList.add('hidden');
    viewer.innerHTML = dashHtml + '<div class="load-more-status" id="loadMoreSentinel"></div>';
    appendNextChunk();
    setupSentinelObserver();
  }

  viewer.scrollTop = preserveScroll ? prevScroll : 0;
}

function onViewerClick(e){
  // Review dashboard controls
  var rfBtn = e.target.closest('.rfpill');
  if (rfBtn) {
    STATE.reviewFilter = rfBtn.getAttribute('data-rf');
    STATE.idx = 0;
    render();
    return;
  }
  if (e.target.closest('#shuffleBtn')) {
    STATE.shuffle = !STATE.shuffle;
    if (STATE.shuffle) STATE.shuffleSeed = Math.floor(Math.random() * 100000) + 1;
    STATE.idx = 0;
    render();
    return;
  }

  var card = e.target.closest('.qcard');
  if (!card) return;
  var key = card.getAttribute('data-key');

  if (e.target.closest('.parseBtn')) {
    var pn = card.querySelector('.panel');
    pn.hidden = !pn.hidden;
    if (!pn.hidden) queueTypeset(pn);
    return;
  }

  var sbtn = e.target.closest('.star');
  if (sbtn) {
    if (stars[key]) delete stars[key];
    else stars[key] = 1;
    saveS();
    if (STATE.mode === 'starred') {
      render(true);
    } else {
      var on = !!stars[key];
      sbtn.classList.toggle('on', on);
      sbtn.textContent = on ? '★ 已收藏' : '☆ 收藏';
    }
    return;
  }

  var mb = e.target.closest('.mbtn');
  if (mb) {
    var mm = mb.getAttribute('data-m');
    var fromReview = (STATE.mode === 'review');
    var res = setQuestionMastery(key, mm, fromReview);
    updateSidebarCounts();
    showToast(res.msg);

    if (fromReview) {
      // In review mode, refresh list/dashboard; in single view keep index (which naturally moves to next due card!)
      render(STATE.view === 'multi');
    } else {
      var bs = card.querySelectorAll('.mbtn');
      for (var j = 0; j < bs.length; j++) bs[j].classList.remove('act-needs', 'act-unknown', 'act-known');
      if (mastery[key]) mb.classList.add('act-' + mastery[key]);
      var metaEl = card.querySelector('.qrev-meta');
      if (mastery[key]) {
        var txt = formatDueText(key, Date.now());
        if (!metaEl) {
          metaEl = document.createElement('span');
          metaEl.className = 'qrev-meta';
          var head = card.querySelector('.qhead');
          var topic = head.querySelector('.qtopic');
          if (topic) head.insertBefore(metaEl, topic);
          else head.appendChild(metaEl);
        }
        metaEl.className = 'qrev-meta' + (isDue(key, Date.now()) ? ' due' : '');
        metaEl.textContent = txt;
      } else if (metaEl) {
        metaEl.remove();
      }
    }
    return;
  }
}

function gotoPrev(){ if (STATE.idx > 0) { STATE.idx--; render(); } }
function gotoNext(){ if (STATE.idx < activeList.length - 1) { STATE.idx++; render(); } }
function openDrawer(){ $('.sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeDrawer(){ $('.sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

function applyScale(){ document.documentElement.style.setProperty('--content-scale', SCALES[STATE.scale] || 1); }
function setSeg(groupId, val, attr){ $$('#' + groupId + ' .segbtn').forEach(function(b){ b.classList.toggle('active', b.getAttribute(attr) === val); }); }
function setView(v){ STATE.view = v; localStorage.setItem('dg_view', v); setSeg('viewSeg', v, 'data-v'); if (v !== 'single' && STATE.idx < 0) STATE.idx = 0; render(); }
function setScale(s){ STATE.scale = s; localStorage.setItem('dg_scale', s); applyScale(); setSeg('scaleSeg', s, 'data-s'); }

var THEME = localStorage.getItem('dg_theme') || 'auto';
var MQL = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  var eff = (THEME === 'auto') ? (MQL && MQL.matches ? 'dark' : 'light') : THEME;
  document.documentElement.setAttribute('data-theme', eff);
}
function setTheme(t){ THEME = t; localStorage.setItem('dg_theme', t); applyTheme(); setSeg('themeSeg', t, 'data-t'); }

function init(){
  applyTheme();
  if (MQL && MQL.addEventListener) MQL.addEventListener('change', function(){ if (THEME === 'auto') applyTheme(); });
  else if (MQL && MQL.addListener) MQL.addListener(function(){ if (THEME === 'auto') applyTheme(); });
  applyScale();

  // Settings popover
  var gear = $('#gearBtn'), pop = $('#settingsPop');
  gear.onclick = function(e){ e.stopPropagation(); pop.hidden = !pop.hidden; gear.classList.toggle('active', !pop.hidden); };
  pop.onclick = function(e){ e.stopPropagation(); };
  document.addEventListener('click', function(){ pop.hidden = true; gear.classList.remove('active'); });

  // Seg buttons
  $$('#viewSeg .segbtn').forEach(function(b){ b.onclick = function(){ setView(b.getAttribute('data-v')); }; });
  $$('#scaleSeg .segbtn').forEach(function(b){ b.onclick = function(){ setScale(b.getAttribute('data-s')); }; });
  $$('#themeSeg .segbtn').forEach(function(b){ b.onclick = function(){ setTheme(b.getAttribute('data-t')); }; });
  setSeg('viewSeg', STATE.view, 'data-v');
  setSeg('scaleSeg', STATE.scale, 'data-s');
  setSeg('themeSeg', THEME, 'data-t');

  // Export / Import
  $('#exportBtn').onclick = function(){
    var data = {app:'大观园-数学题集', version:2, mastery:mastery, stars:stars, review:reviewMap};
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '大观园-学习记录.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('已导出学习记录');
  };
  $('#importBtn').onclick = function(){ $('#importFile').click(); };
  $('#importFile').onchange = function(){
    var f = this.files && this.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var o = JSON.parse(rd.result);
        if (o.mastery && typeof o.mastery === 'object') { for (var k in o.mastery) mastery[k] = o.mastery[k]; }
        if (o.stars && typeof o.stars === 'object') { for (var s in o.stars) stars[s] = o.stars[s]; }
        if (o.review && typeof o.review === 'object') { for (var r in o.review) reviewMap[r] = o.review[r]; }
        syncLegacyReview();
        saveM(); saveS(); saveR();
        updateSidebarCounts();
        render();
        showToast('导入成功');
      } catch(err) {
        showToast('导入失败：' + err.message);
      }
    };
    rd.readAsText(f);
    this.value = '';
  };

  // Tabs
  $('#tabBank').onclick = function(){ STATE.mode = 'bank'; STATE.idx = 0; syncTabs(); render(); };
  $('#tabReview').onclick = function(){ STATE.mode = 'review'; STATE.idx = 0; syncTabs(); render(); };
  $('#tabStar').onclick = function(){ STATE.mode = 'starred'; STATE.idx = 0; syncTabs(); render(); };

  // Search with debounce
  var searchTimer = null;
  var searchInput = $('#searchInput');
  var searchClear = $('#searchClear');
  searchInput.addEventListener('input', function(){
    var val = searchInput.value.trim();
    searchClear.classList.toggle('show', !!val);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      STATE.query = val;
      STATE.idx = 0;
      render();
    }, 150);
  });
  searchClear.onclick = function(){
    searchInput.value = '';
    searchClear.classList.remove('show');
    STATE.query = '';
    STATE.idx = 0;
    render();
    searchInput.focus();
  };

  // Pager & back to top
  $('#prev').onclick = gotoPrev;
  $('#next').onclick = gotoNext;
  var viewer = $('#viewer'), topBtn = $('#topBtn');
  viewer.addEventListener('scroll', function(){
    topBtn.classList.toggle('show', viewer.scrollTop > 400);
  }, {passive: true});
  topBtn.onclick = function(){ viewer.scrollTo({top: 0, behavior: 'smooth'}); };

  // Sidebar toggle
  $('#dirBtn').onclick = function(){
    if (window.innerWidth <= 860) {
      if ($('.sidebar').classList.contains('open')) closeDrawer();
      else openDrawer();
    } else {
      $('.sidebar').classList.toggle('collapsed');
    }
  };
  $('#overlay').onclick = closeDrawer;

  // Viewer delegation
  viewer.addEventListener('click', onViewerClick);

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { pop.hidden = true; gear.classList.remove('active'); return; }
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
    if (STATE.view !== 'single' || !activeList.length) return;
    if (e.key === 'ArrowLeft') gotoPrev();
    else if (e.key === 'ArrowRight') gotoNext();
    else if (e.key === ' ') {
      e.preventDefault();
      var pb = viewer.querySelector('.qcard .parseBtn');
      if (pb) pb.click();
    } else if (e.key === '1' || e.key === '2' || e.key === '3') {
      var map = {'1':'needs', '2':'unknown', '3':'known'};
      var mb = viewer.querySelector('.qcard .mbtn[data-m="' + map[e.key] + '"]');
      if (mb) mb.click();
    } else if (e.key === 's' || e.key === 'S') {
      var sb = viewer.querySelector('.qcard .star');
      if (sb) sb.click();
    }
  });

  syncTabs();
  buildSidebar();
  render();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
